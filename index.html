<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Расходы">
<title>Трекер расходов</title>
<style>
:root {
  --bg: #0D0D0F; --card: rgba(255,255,255,0.03); --border: rgba(255,255,255,0.06);
  --text: #F0F0F0; --text2: #CCC; --text3: #888; --text4: #555;
  --accent: #4ECDC4; --accent2: #45B7D1; --danger: #FF6B6B;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif;
  background: var(--bg); color: var(--text);
  max-width: 480px; margin: 0 auto; min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}
input, button { font-family: inherit; }
input:focus { outline: none; }
button { cursor: pointer; border: none; background: none; }
@keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
@keyframes toastIn { from{opacity:0;transform:translateX(-50%) translateY(20px) scale(.9)} to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)} }

.header { padding: 20px 20px 14px; background: linear-gradient(180deg,#151518,var(--bg)); }
.header-top { display:flex; justify-content:space-between; align-items:flex-start; }
.month-label { font-size:12px; color:var(--text3); font-weight:700; letter-spacing:1px; text-transform:uppercase; }
.total-row { margin-top:4px; }
.total-amount { font-size:28px; font-weight:800; }
.total-currency { font-size:18px; font-weight:700; opacity:.5; }
.total-of { font-size:13px; color:var(--text4); }
.remain-badge { padding:8px 12px; border-radius:12px; font-size:12px; font-weight:600; text-align:center; line-height:1.5; }
.progress-track { height:6px; background:rgba(255,255,255,0.06); border-radius:3px; margin-top:14px; overflow:hidden; }
.progress-fill { height:100%; border-radius:3px; transition:width .6s cubic-bezier(.23,1,.32,1), background .3s; }

.content { padding:16px 20px; padding-bottom: calc(80px + var(--safe-b)); }
.content[data-anim] { animation: fadeIn .3s ease; }

.amount-wrap {
  display:flex; align-items:center; justify-content:center;
  background:var(--card); border-radius:16px; padding:14px 20px;
  border:1px solid var(--border); margin-bottom:20px;
}
.amount-input {
  background:transparent; border:none; color:var(--text);
  font-size:34px; font-weight:800; text-align:center; width:100%;
  caret-color:var(--accent); font-variant-numeric: tabular-nums;
}
.amount-cur { font-size:22px; font-weight:700; color:var(--text4); margin-left:4px; }

.cat-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:16px; }
.cat-btn {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:12px 4px; border-radius:14px; border:2px solid rgba(255,255,255,0.08);
  background:var(--card); transition:all .15s; min-height:68px;
}
.cat-btn:active { transform:scale(.93); }
.cat-btn.selected { transform:scale(1.05); }
.cat-btn .icon { font-size:24px; }
.cat-btn .label { font-size:10px; font-weight:600; margin-top:4px; color:var(--text2); }
.cat-btn.add-btn { border-style:dashed; border-color:rgba(255,255,255,0.15); }

.note-input {
  width:100%; background:var(--card); border:1px solid var(--border);
  border-radius:12px; padding:12px 16px; color:var(--text); font-size:14px; margin-bottom:12px;
}
.note-input::placeholder { color:var(--text4); }

.primary-btn {
  width:100%; padding:14px; border-radius:14px;
  background:linear-gradient(135deg,var(--accent),var(--accent2)); color:var(--bg);
  font-size:16px; font-weight:700; transition:opacity .2s;
}
.primary-btn:disabled { opacity:.4; }

.section-title {
  font-size:13px; font-weight:700; color:var(--text3); margin-bottom:12px;
  letter-spacing:.5px; text-transform:uppercase;
}

.expense-row {
  display:flex; align-items:center; padding:12px 14px; margin-bottom:6px;
  background:var(--card); border-radius:12px; border:1px solid rgba(255,255,255,0.04);
  animation:fadeIn .3s ease;
}
.expense-row .icon { font-size:20px; flex-shrink:0; }
.expense-row .info { flex:1; margin-left:10px; }
.expense-row .name { font-size:14px; font-weight:600; color:#DDD; }
.expense-row .date { font-size:11px; color:var(--text4); margin-top:2px; font-variant-numeric:tabular-nums; }
.expense-row .sum { font-size:15px; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap; }
.del-btn {
  background:rgba(255,107,107,0.1); color:var(--danger); border-radius:8px;
  width:28px; height:28px; font-size:12px; display:flex; align-items:center; justify-content:center; margin-left:8px;
}

.add-cat-panel {
  background:var(--card); border:1px solid rgba(78,205,196,0.2);
  border-radius:16px; padding:16px; margin-bottom:16px; animation:fadeIn .3s ease;
}
.add-cat-panel h3 { font-size:14px; font-weight:700; color:var(--accent); margin-bottom:12px; }
.add-cat-panel .sub { font-size:11px; font-weight:600; color:var(--text3); margin:10px 0 6px; text-transform:uppercase; }
.icon-grid { display:flex; flex-wrap:wrap; gap:6px; }
.icon-opt {
  width:38px; height:38px; border-radius:10px; font-size:18px;
  display:flex; align-items:center; justify-content:center;
  background:var(--card); border:2px solid transparent; transition:all .15s;
}
.icon-opt.sel { background:rgba(78,205,196,0.2); border-color:var(--accent); }
.color-grid { display:flex; flex-wrap:wrap; gap:6px; }
.color-opt {
  width:28px; height:28px; border-radius:50%; border:3px solid transparent; transition:all .15s;
}
.color-opt.sel { border-color:#FFF; transform:scale(1.25); }
.preview-row { display:flex; align-items:center; gap:10px; margin-top:14px; }
.preview-icon {
  width:44px; height:44px; border-radius:12px; display:flex;
  align-items:center; justify-content:center; font-size:22px;
}
.small-btn {
  padding:8px 16px; border-radius:10px; background:var(--accent);
  color:var(--bg); font-weight:700; font-size:15px; transition:opacity .2s;
}

.chart-wrap {
  background:rgba(255,255,255,0.02); border-radius:16px; padding:16px 12px;
  border:1px solid rgba(255,255,255,0.04); margin-bottom:16px;
}
.chart-wrap canvas { width:100%; display:block; }
.cat-list-item {
  display:flex; align-items:center; gap:8px; padding:8px 12px;
  background:rgba(255,255,255,0.02); border-radius:10px; margin-bottom:4px;
}
.cat-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
.cat-list-name { flex:1; font-size:13px; font-weight:600; }
.cat-list-val { font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; }
.cat-list-pct { font-size:11px; color:var(--text3); width:32px; text-align:right; }

.stats-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:16px; }
.stat-card {
  text-align:center; padding:14px 8px; background:var(--card);
  border-radius:14px; border:1px solid rgba(255,255,255,0.04);
}
.stat-val { font-size:18px; font-weight:800; color:var(--accent); }
.stat-label { font-size:10px; color:var(--text3); margin-top:4px; font-weight:600; }

.settings-card {
  padding:16px; background:var(--card); border-radius:14px;
  border:1px solid rgba(255,255,255,0.04); margin-bottom:12px;
}
.settings-label { font-size:12px; color:var(--text3); font-weight:600; }
.settings-val { margin-top:6px; font-size:18px; font-weight:700; color:var(--text); }
.settings-val .edit { font-size:12px; opacity:.5; }
.custom-cat-row {
  display:flex; align-items:center; padding:10px 0;
  border-bottom:1px solid rgba(255,255,255,0.04);
}
.danger-btn {
  width:100%; padding:14px; border-radius:14px; border:1px solid rgba(255,107,107,0.2);
  background:rgba(255,107,107,0.06); color:var(--danger);
  font-size:14px; font-weight:700; margin-top:12px;
}

.nav {
  position:fixed; bottom:0; left:50%; transform:translateX(-50%);
  width:100%; max-width:480px; display:flex; justify-content:space-around;
  background:rgba(13,13,15,0.95); -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px);
  border-top:1px solid rgba(255,255,255,0.06);
  padding:8px 0 calc(12px + var(--safe-b)); z-index:100;
}
.nav-btn {
  display:flex; flex-direction:column; align-items:center;
  font-weight:600; transition:color .2s; padding:4px 12px; color:var(--text4);
}
.nav-btn:active { transform:scale(.95); }
.nav-btn .ni { font-size:20px; transition:font-size .2s; }
.nav-btn.active { color:var(--accent); }
.nav-btn.active .ni { font-size:22px; }
.nav-btn .nl { font-size:10px; margin-top:2px; }

.toast {
  position:fixed; bottom:calc(80px + var(--safe-b)); left:50%; transform:translateX(-50%);
  background:#1A1A1E; color:var(--accent); padding:10px 24px;
  border-radius:30px; font-size:14px; font-weight:700; z-index:200;
  border:1px solid rgba(78,205,196,0.3); animation:toastIn .3s ease;
  pointer-events:none;
}

.empty { text-align:center; color:var(--text4); padding:40px 0; font-size:14px; }
.budget-edit { display:flex; gap:8px; margin-top:8px; }
.budget-edit input { flex:1; }
.about { margin-top:24px; text-align:center; padding:16px; font-size:13px; color:var(--text4); line-height:1.6; }
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';

const MONTHS = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const DEFAULT_CATS = [
  {id:"food",name:"Еда",icon:"🍔",color:"#FF6B6B"},
  {id:"transport",name:"Транспорт",icon:"🚕",color:"#4ECDC4"},
  {id:"housing",name:"Жильё",icon:"🏠",color:"#45B7D1"},
  {id:"health",name:"Здоровье",icon:"💊",color:"#96CEB4"},
  {id:"clothes",name:"Одежда",icon:"👕",color:"#FFEAA7"},
  {id:"fun",name:"Развлечения",icon:"🎮",color:"#DDA0DD"},
  {id:"education",name:"Обучение",icon:"📚",color:"#74B9FF"},
  {id:"other",name:"Прочее",icon:"📦",color:"#A8A8A8"},
];
const ICONS = ["🏪","🛒","☕","🍕","🎬","✈️","🏋️","💇","🐾","🎁","📱","💻","🔧","🚌","⛽","🏥","👶","🎓","💰","🏦","🧾","🍽️","🛍️","🚗","🏢","💼","🎵","📷","🌿","🧹"];
const COLORS = ["#FF6B6B","#4ECDC4","#45B7D1","#96CEB4","#FFEAA7","#DDA0DD","#74B9FF","#FF8A5C","#A29BFE","#FD79A8","#00B894","#E17055","#6C5CE7","#FDCB6E","#E84393","#00CEC9"];

// State
let state = {
  expenses: JSON.parse(localStorage.getItem('exp_data') || '[]'),
  customCats: JSON.parse(localStorage.getItem('exp_cats') || '[]'),
  budget: Number(localStorage.getItem('exp_budget') || '200000'),
  view: 'add',
  selCat: null,
  amount: '',
  note: '',
  showAddCat: false,
  newCatName: '',
  newCatIcon: '🏪',
  newCatColor: '#FF8A5C',
  editBudget: false,
  budgetInput: '',
  toast: null,
  toastTimer: null,
};

const save = () => {
  localStorage.setItem('exp_data', JSON.stringify(state.expenses));
  localStorage.setItem('exp_cats', JSON.stringify(state.customCats));
  localStorage.setItem('exp_budget', String(state.budget));
};

const allCats = () => [...DEFAULT_CATS, ...state.customCats];
const getCat = (id) => allCats().find(c => c.id === id) || DEFAULT_CATS[7];

const fmtMoney = (n) => {
  if (n >= 1000000) return (n/1000000).toFixed(1).replace(/\.0$/,'') + 'M';
  if (n >= 10000) return Math.round(n/1000) + 'K';
  return n.toLocaleString('ru-RU');
};

const fmtDate = (iso) => {
  const d = new Date(iso);
  return d.toLocaleDateString('ru-RU', {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
};

const showToast = (msg) => {
  clearTimeout(state.toastTimer);
  state.toast = msg;
  render();
  state.toastTimer = setTimeout(() => { state.toast = null; render(); }, 2000);
};

const now = new Date();
const curMonth = now.getMonth(), curYear = now.getFullYear();
const monthExps = () => state.expenses.filter(e => { const d = new Date(e.date); return d.getMonth() === curMonth && d.getFullYear() === curYear; });
const totalSpent = () => monthExps().reduce((s,e) => s + e.amount, 0);

// --- Drawing Charts with Canvas ---
function drawPie(canvas, data) {
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.parentElement.clientWidth - 24;
  const h = 200;
  canvas.width = w * dpr; canvas.height = h * dpr;
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  ctx.scale(dpr, dpr);
  ctx.clearRect(0,0,w,h);

  const total = data.reduce((s,d) => s + d.value, 0);
  if (!total) return;
  const cx = w/2, cy = h/2, outer = 80, inner = 50;
  let angle = -Math.PI/2;

  data.forEach(d => {
    const slice = (d.value / total) * Math.PI * 2;
    ctx.beginPath();
    ctx.arc(cx, cy, outer, angle, angle + slice);
    ctx.arc(cx, cy, inner, angle + slice, angle, true);
    ctx.closePath();
    ctx.fillStyle = d.color;
    ctx.fill();
    angle += slice + 0.03;
  });
}

function drawBars(canvas, data) {
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.parentElement.clientWidth - 24;
  const h = 160;
  canvas.width = w * dpr; canvas.height = h * dpr;
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  ctx.scale(dpr, dpr);
  ctx.clearRect(0,0,w,h);

  const max = Math.max(...data.map(d => d.total), 1);
  const barW = Math.min(24, (w - 40) / data.length - 8);
  const gap = (w - barW * data.length) / (data.length + 1);
  const chartH = h - 30;

  data.forEach((d, i) => {
    const x = gap + i * (barW + gap);
    const barH = (d.total / max) * (chartH - 10);
    const y = chartH - barH;
    const r = Math.min(6, barW/2);

    if (barH > 0) {
      ctx.beginPath();
      ctx.moveTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.lineTo(x + barW - r, y);
      ctx.quadraticCurveTo(x + barW, y, x + barW, y + r);
      ctx.lineTo(x + barW, chartH);
      ctx.lineTo(x, chartH);
      ctx.closePath();
      ctx.fillStyle = '#4ECDC4';
      ctx.fill();
    }

    ctx.fillStyle = '#888';
    ctx.font = '10px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(d.label, x + barW/2, h - 6);
  });
}

// --- Rendering ---
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  if (attrs) Object.entries(attrs).forEach(([k,v]) => {
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else el.setAttribute(k, v);
  });
  children.flat(Infinity).forEach(c => {
    if (c == null || c === false) return;
    el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return el;
}

function renderHeader() {
  const spent = totalSpent();
  const rem = state.budget - spent;
  const pct = state.budget > 0 ? Math.min((spent/state.budget)*100, 100) : 0;
  const fillColor = pct > 90 ? '#FF6B6B' : pct > 70 ? '#FFEAA7' : '#4ECDC4';

  return h('div', {class:'header'},
    h('div', {class:'header-top'},
      h('div', null,
        h('div', {class:'month-label'}, MONTHS[curMonth] + ' ' + curYear),
        h('div', {class:'total-row'},
          h('span', {class:'total-amount'}, fmtMoney(spent)),
          h('span', {class:'total-currency'}, ' ₸'),
          h('span', {class:'total-of'}, ' из ' + fmtMoney(state.budget) + ' ₸'),
        ),
      ),
      h('div', {class:'remain-badge', style:{
        background: rem >= 0 ? 'rgba(78,205,196,0.15)' : 'rgba(255,107,107,0.15)',
        color: rem >= 0 ? '#4ECDC4' : '#FF6B6B',
      }},
        (rem >= 0 ? 'Осталось' : 'Перерасход'),
        h('br'),
        h('strong', null, fmtMoney(Math.abs(rem)) + ' ₸'),
      ),
    ),
    h('div', {class:'progress-track'},
      h('div', {class:'progress-fill', style:{width:pct+'%', background:fillColor}}),
    ),
  );
}

function renderAdd() {
  const wrap = h('div', {'data-anim':'1', class:'content'});

  // Amount
  const inp = h('input', {type:'text', inputmode:'decimal', placeholder:'0', class:'amount-input', value: state.amount});
  inp.addEventListener('input', e => { state.amount = e.target.value.replace(/[^0-9.,\s]/g,''); });
  wrap.appendChild(h('div', {class:'amount-wrap'}, inp, h('span',{class:'amount-cur'},'₸')));

  // Categories
  const grid = h('div', {class:'cat-grid'});
  allCats().forEach(cat => {
    const sel = state.selCat === cat.id;
    const btn = h('button', {class:'cat-btn' + (sel?' selected':''), style:{
      background: sel ? cat.color+'22' : '', borderColor: sel ? cat.color : '',
    }, onClick: () => { state.selCat = state.selCat === cat.id ? null : cat.id; render(); }},
      h('span',{class:'icon'}, cat.icon),
      h('span',{class:'label'}, cat.name),
    );
    grid.appendChild(btn);
  });

  // Add cat button
  grid.appendChild(h('button', {class:'cat-btn add-btn', style:{
    background: state.showAddCat ? 'rgba(78,205,196,0.1)' : '',
    borderColor: state.showAddCat ? '#4ECDC4' : '',
  }, onClick:()=>{ state.showAddCat = !state.showAddCat; render(); }},
    h('span',{class:'icon'}, state.showAddCat ? '✕' : '＋'),
    h('span',{class:'label'}, state.showAddCat ? 'Отмена' : 'Своя'),
  ));
  wrap.appendChild(grid);

  // Add category panel
  if (state.showAddCat) {
    const panel = h('div', {class:'add-cat-panel'});
    panel.appendChild(h('h3',null,'Новая категория'));

    const nameInp = h('input', {type:'text', class:'note-input', placeholder:'Название (напр. Кофе, Такси...)', value:state.newCatName});
    nameInp.addEventListener('input', e => { state.newCatName = e.target.value; });
    panel.appendChild(nameInp);

    panel.appendChild(h('div',{class:'sub'},'Иконка'));
    const ig = h('div',{class:'icon-grid'});
    ICONS.forEach(ic => {
      ig.appendChild(h('button',{class:'icon-opt'+(state.newCatIcon===ic?' sel':''), onClick:()=>{state.newCatIcon=ic;render();}}, ic));
    });
    panel.appendChild(ig);

    panel.appendChild(h('div',{class:'sub'},'Цвет'));
    const cg = h('div',{class:'color-grid'});
    COLORS.forEach(cl => {
      cg.appendChild(h('button',{class:'color-opt'+(state.newCatColor===cl?' sel':''), style:{background:cl}, onClick:()=>{state.newCatColor=cl;render();}}));
    });
    panel.appendChild(cg);

    const canAdd = state.newCatName.trim().length > 0;
    panel.appendChild(h('div',{class:'preview-row'},
      h('div',{class:'preview-icon',style:{background:state.newCatColor+'22',border:'2px solid '+state.newCatColor}}, state.newCatIcon),
      h('div',{style:{flex:'1'}},
        h('div',{style:{fontSize:'15px',fontWeight:'700',color:state.newCatColor}}, state.newCatName || 'Название'),
        h('div',{style:{fontSize:'11px',color:'#666'}}, 'Превью'),
      ),
      h('button',{class:'small-btn',style:{opacity:canAdd?'1':'.4'}, onClick:()=>{
        if(!canAdd) return;
        state.customCats.push({id:'c_'+Date.now().toString(36),name:state.newCatName.trim(),icon:state.newCatIcon,color:state.newCatColor,custom:true});
        state.newCatName=''; state.newCatIcon='🏪'; state.newCatColor='#FF8A5C'; state.showAddCat=false;
        save(); showToast('✓ Категория добавлена!');
      }}, 'Добавить'),
    ));
    wrap.appendChild(panel);
  }

  // Note
  const noteInp = h('input',{type:'text',class:'note-input',placeholder:'Заметка (необязательно)',value:state.note});
  noteInp.addEventListener('input', e => { state.note = e.target.value; });
  wrap.appendChild(noteInp);

  // Add button
  const canSave = state.amount && state.selCat;
  wrap.appendChild(h('button',{class:'primary-btn',disabled:!canSave,onClick:()=>{
    const num = parseFloat(state.amount.replace(/\s/g,'').replace(',','.'));
    if(!num || num<=0 || !state.selCat) return;
    state.expenses.unshift({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),amount:num,category:state.selCat,note:state.note.trim(),date:new Date().toISOString()});
    state.amount=''; state.selCat=null; state.note='';
    save(); showToast('✓ Записано!');
  }}, 'Записать расход'));

  // Recent
  const me = monthExps();
  if (me.length) {
    wrap.appendChild(h('div',{style:{marginTop:'24px'}},
      h('div',{class:'section-title'},'Последние записи'),
      ...me.slice(0,3).map(e => {
        const cat = getCat(e.category);
        return h('div',{class:'expense-row'},
          h('span',{class:'icon'},cat.icon),
          h('div',{class:'info'},
            h('div',{class:'name'}, cat.name + (e.note?' · '+e.note:'')),
            h('div',{class:'date'}, fmtDate(e.date)),
          ),
          h('div',{class:'sum',style:{color:cat.color}}, '−'+fmtMoney(e.amount)+' ₸'),
        );
      }),
    ));
  }
  return wrap;
}

function renderList() {
  const wrap = h('div',{'data-anim':'1',class:'content'});
  wrap.appendChild(h('div',{class:'section-title'},'Все расходы за '+MONTHS[curMonth].toLowerCase()));
  const me = monthExps();
  if(!me.length) { wrap.appendChild(h('div',{class:'empty'},'Пока пусто. Добавьте первый расход!')); return wrap; }
  me.forEach(e => {
    const cat = getCat(e.category);
    wrap.appendChild(h('div',{class:'expense-row'},
      h('span',{class:'icon'},cat.icon),
      h('div',{class:'info'},
        h('div',{class:'name'}, cat.name+(e.note?' · '+e.note:'')),
        h('div',{class:'date'}, fmtDate(e.date)),
      ),
      h('div',{style:{display:'flex',alignItems:'center',gap:'8px'}},
        h('div',{class:'sum',style:{color:cat.color}}, '−'+fmtMoney(e.amount)+' ₸'),
        h('button',{class:'del-btn',onClick:()=>{ state.expenses=state.expenses.filter(x=>x.id!==e.id); save(); showToast('Удалено'); }},'✕'),
      ),
    ));
  });
  return wrap;
}

function renderAnalytics() {
  const wrap = h('div',{'data-anim':'1',class:'content'});
  const me = monthExps();
  if(!me.length) { wrap.appendChild(h('div',{class:'empty'},'Нет данных для аналитики.')); return wrap; }

  const spent = totalSpent();
  const map = {};
  me.forEach(e => { map[e.category] = (map[e.category]||0) + e.amount; });
  const catData = allCats().map(c=>({...c,value:map[c.id]||0})).filter(c=>c.value>0).sort((a,b)=>b.value-a.value);

  // Pie
  wrap.appendChild(h('div',{class:'section-title'},'По категориям'));
  const pieCanvas = h('canvas');
  const pieWrap = h('div',{class:'chart-wrap'}, pieCanvas);
  wrap.appendChild(pieWrap);
  requestAnimationFrame(() => drawPie(pieCanvas, catData));

  // Cat list
  catData.forEach(c => {
    wrap.appendChild(h('div',{class:'cat-list-item'},
      h('div',{class:'cat-dot',style:{background:c.color}}),
      h('span',{class:'cat-list-name'}, c.icon+' '+c.name),
      h('span',{class:'cat-list-val'}, fmtMoney(c.value)+' ₸'),
      h('span',{class:'cat-list-pct'}, Math.round(c.value/spent*100)+'%'),
    ));
  });

  // Bar chart - last 7 days
  wrap.appendChild(h('div',{class:'section-title',style:{marginTop:'28px'}},'Последние 7 дней'));
  const days = [];
  for(let i=6;i>=0;i--) {
    const d=new Date(); d.setDate(d.getDate()-i);
    const key=d.toISOString().slice(0,10);
    const tot=state.expenses.filter(e=>e.date.slice(0,10)===key).reduce((s,e)=>s+e.amount,0);
    days.push({label:d.getDate()+' '+MONTHS[d.getMonth()].slice(0,3).toLowerCase(), total:tot});
  }
  const barCanvas = h('canvas');
  const barWrap = h('div',{class:'chart-wrap'}, barCanvas);
  wrap.appendChild(barWrap);
  requestAnimationFrame(() => drawBars(barCanvas, days));

  // Stats
  wrap.appendChild(h('div',{class:'stats-grid'},
    h('div',{class:'stat-card'}, h('div',{class:'stat-val'},String(me.length)), h('div',{class:'stat-label'},'Записей')),
    h('div',{class:'stat-card'}, h('div',{class:'stat-val'},fmtMoney(Math.round(spent/Math.max(now.getDate(),1)))+' ₸'), h('div',{class:'stat-label'},'В среднем/день')),
    h('div',{class:'stat-card'}, h('div',{class:'stat-val'},catData[0]?.icon||'—'), h('div',{class:'stat-label'},'Топ категория')),
  ));
  return wrap;
}

function renderSettings() {
  const wrap = h('div',{'data-anim':'1',class:'content'});
  wrap.appendChild(h('div',{class:'section-title'},'Настройки'));

  // Budget
  const bCard = h('div',{class:'settings-card'});
  bCard.appendChild(h('div',{class:'settings-label'},'Бюджет на месяц'));
  if(state.editBudget) {
    const bi = h('input',{type:'text',inputmode:'numeric',class:'note-input',value:state.budgetInput,style:{margin:'0',flex:'1'}});
    bi.addEventListener('input',e=>{state.budgetInput=e.target.value.replace(/[^0-9]/g,'');});
    bCard.appendChild(h('div',{class:'budget-edit'}, bi,
      h('button',{class:'small-btn',onClick:()=>{
        const v=parseInt(state.budgetInput); if(v>0) state.budget=v;
        state.editBudget=false; save(); render();
      }},'✓'),
    ));
  } else {
    bCard.appendChild(h('button',{class:'settings-val',style:{display:'block',textAlign:'left',cursor:'pointer'},onClick:()=>{state.budgetInput=String(state.budget);state.editBudget=true;render();}},
      fmtMoney(state.budget)+' ₸ ', h('span',{class:'edit'},'✎'),
    ));
  }
  wrap.appendChild(bCard);

  // Custom cats
  const cCard = h('div',{class:'settings-card'});
  cCard.appendChild(h('div',{class:'settings-label'},'Мои категории'));
  if(!state.customCats.length) {
    cCard.appendChild(h('div',{style:{fontSize:'13px',color:'#555',marginTop:'8px'}},'Нет своих категорий. Добавьте через «＋ Своя».'));
  }
  state.customCats.forEach(c => {
    cCard.appendChild(h('div',{class:'custom-cat-row'},
      h('span',{style:{fontSize:'20px'}},c.icon),
      h('span',{style:{flex:'1',marginLeft:'8px',fontSize:'14px',fontWeight:'600'}},c.name),
      h('div',{class:'cat-dot',style:{background:c.color,width:'14px',height:'14px'}}),
      h('button',{class:'del-btn',style:{marginLeft:'8px'},onClick:()=>{
        state.customCats=state.customCats.filter(x=>x.id!==c.id); save(); showToast('Удалено'); render();
      }},'✕'),
    ));
  });
  wrap.appendChild(cCard);

  // Currency
  const cur = h('div',{class:'settings-card'});
  cur.appendChild(h('div',{class:'settings-label'},'Валюта'));
  cur.appendChild(h('div',{class:'settings-val'},'₸ Тенге'));
  wrap.appendChild(cur);

  wrap.appendChild(h('button',{class:'danger-btn',onClick:()=>{
    if(confirm('Удалить ВСЕ расходы?')) { state.expenses=[]; save(); showToast('Очищено'); }
  }},'🗑 Удалить все данные'));

  wrap.appendChild(h('div',{class:'about'},'Персональный трекер расходов v1.1','Данные хранятся на вашем устройстве.','Работает полностью офлайн.'));
  return wrap;
}

function renderNav() {
  const tabs = [{id:'add',icon:'＋',label:'Добавить'},{id:'list',icon:'☰',label:'История'},{id:'analytics',icon:'◔',label:'Аналитика'},{id:'settings',icon:'⚙',label:'Настройки'}];
  return h('div',{class:'nav'},
    ...tabs.map(t => h('button',{class:'nav-btn'+(state.view===t.id?' active':''),onClick:()=>{state.view=t.id;render();}},
      h('span',{class:'ni'},t.icon), h('span',{class:'nl'},t.label),
    )),
  );
}

function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  app.appendChild(renderHeader());

  switch(state.view) {
    case 'add': app.appendChild(renderAdd()); break;
    case 'list': app.appendChild(renderList()); break;
    case 'analytics': app.appendChild(renderAnalytics()); break;
    case 'settings': app.appendChild(renderSettings()); break;
  }
  app.appendChild(renderNav());

  if(state.toast) {
    app.appendChild(h('div',{class:'toast'},state.toast));
  }
}

render();
</script>
</body>
</html>
