<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Мои Финансы">
<title>Мои Финансы</title>
<style>
:root{
  --bg:#0D0D0F;--card:rgba(255,255,255,0.04);--border:rgba(255,255,255,0.07);
  --text:#F0F0F0;--text2:#CCC;--text3:#888;--text4:#555;
  --accent:#4ECDC4;--accent2:#45B7D1;--danger:#FF6B6B;--green:#00B894;
  --st:env(safe-area-inset-top,44px);--sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'SF Pro Display','Helvetica Neue',sans-serif;background:var(--bg);color:var(--text);max-width:480px;margin:0 auto;min-height:100vh;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
input,button,select{font-family:inherit}input:focus{outline:none}button{cursor:pointer;border:none;background:none}
 
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(14px) scale(.9)}to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
 
/* PIN */
#pin-screen{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;padding-top:calc(20px + var(--st))}
.pin-logo{font-size:42px;margin-bottom:10px}
.pin-title{font-size:18px;font-weight:700;margin-bottom:4px;text-align:center}
.pin-sub{font-size:13px;color:var(--text3);margin-bottom:26px;text-align:center}
.pin-dots{display:flex;gap:16px;margin-bottom:30px}
.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--text4);transition:all .15s}
.pin-dot.on{background:var(--accent);border-color:var(--accent);transform:scale(1.1)}
.pin-dot.err{background:var(--danger);border-color:var(--danger);animation:shake .4s}
.pin-pad{display:grid;grid-template-columns:repeat(3,76px);gap:12px}
.pin-key{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--text);font-size:26px;font-weight:600;display:flex;align-items:center;justify-content:center;transition:all .1s}
.pin-key:active{background:rgba(78,205,196,0.18);transform:scale(.92)}
.pin-skip{margin-top:18px;color:var(--text4);font-size:13px;padding:8px 20px}
 
/* HEADER */
.hdr{padding:12px 18px 12px;padding-top:calc(12px + var(--st));background:linear-gradient(180deg,#161619 0%,var(--bg) 100%)}
.month-nav{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.mnav-btn{color:var(--text3);font-size:22px;padding:2px 10px;border-radius:8px;line-height:1}
.mnav-btn:active{background:var(--card)}
.month-lbl{font-size:12px;color:var(--text3);font-weight:700;letter-spacing:.8px;text-transform:uppercase;flex:1;text-align:center}
.remain-b{padding:5px 10px;border-radius:9px;font-size:11px;font-weight:600;text-align:center;line-height:1.5}
.hdr-nums{display:flex;gap:7px;margin-bottom:10px}
.hdr-num{flex:1;padding:8px 8px;border-radius:10px;text-align:center}
.hn-lbl{font-size:9px;font-weight:700;margin-bottom:2px;letter-spacing:.4px}
.hn-val{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
.prog-track{height:5px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;border-radius:3px;transition:width .7s cubic-bezier(.23,1,.32,1),background .3s}
 
/* PAGE */
.page{padding:13px 17px calc(78px + var(--sb));animation:fadeIn .25s ease}
 
/* INPUTS */
.amount-wrap{display:flex;align-items:center;justify-content:center;background:var(--card);border-radius:15px;padding:11px 16px;border:1px solid var(--border);margin-bottom:11px}
.amount-inp{background:transparent;border:none;color:var(--text);font-size:34px;font-weight:800;text-align:center;width:100%;caret-color:var(--accent);font-variant-numeric:tabular-nums}
.amount-sym{font-size:20px;font-weight:700;color:var(--text4);margin-left:5px;flex-shrink:0}
.field{width:100%;background:var(--card);border:1px solid var(--border);border-radius:11px;padding:10px 13px;color:var(--text);font-size:14px;margin-bottom:9px}
.field::placeholder{color:var(--text4)}
 
/* TOGGLES */
.seg{display:flex;gap:6px;margin-bottom:11px}
.seg-btn{flex:1;padding:9px 4px;border-radius:11px;font-size:13px;font-weight:700;text-align:center;border:2px solid var(--border);color:var(--text3);transition:all .15s}
.seg-btn:active{transform:scale(.97)}
.seg-btn.exp-on{background:rgba(255,107,107,0.12);border-color:var(--danger);color:var(--danger)}
.seg-btn.inc-on{background:rgba(0,184,148,0.12);border-color:var(--green);color:var(--green)}
.cur-row{display:flex;gap:5px;margin-bottom:11px}
.cur-btn{flex:1;padding:7px 3px;border-radius:9px;font-size:12px;font-weight:700;text-align:center;border:2px solid var(--border);color:var(--text3);transition:all .15s}
.cur-btn.on{border-color:var(--accent);background:rgba(78,205,196,0.1);color:var(--accent)}
 
/* CATEGORIES */
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:11px}
.cat-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:9px 3px;border-radius:12px;border:2px solid rgba(255,255,255,0.07);background:var(--card);transition:all .15s;min-height:60px}
.cat-btn:active{transform:scale(.93)}
.cat-btn.on{transform:scale(1.05)}
.cat-btn .ci{font-size:20px}.cat-btn .cn{font-size:9px;font-weight:600;margin-top:2px;color:var(--text2);text-align:center;line-height:1.2}
.cat-btn.dashed{border-style:dashed;border-color:rgba(255,255,255,0.13)}
 
/* NEW CAT PANEL */
.panel{background:var(--card);border:1px solid rgba(78,205,196,0.2);border-radius:13px;padding:13px;margin-bottom:11px;animation:fadeIn .25s ease}
.panel-title{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:9px}
.panel-sub{font-size:10px;font-weight:700;color:var(--text4);margin:7px 0 5px;text-transform:uppercase;letter-spacing:.4px}
.icon-grid{display:flex;flex-wrap:wrap;gap:5px}
.icon-opt{width:34px;height:34px;border-radius:8px;font-size:16px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.04);border:2px solid transparent;transition:all .12s}
.icon-opt.on{background:rgba(78,205,196,0.2);border-color:var(--accent)}
.clr-grid{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:4px}
.clr-opt{width:24px;height:24px;border-radius:50%;border:3px solid transparent;transition:all .12s}
.clr-opt.on{border-color:#FFF;transform:scale(1.25)}
.preview-row{display:flex;align-items:center;gap:10px;margin-top:11px}
.preview-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
 
/* BUTTONS */
.btn-primary{width:100%;padding:13px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0D0D0F;font-size:15px;font-weight:800;transition:opacity .2s}
.btn-income{background:linear-gradient(135deg,var(--green),#00CEC9)}
.btn-sm{padding:7px 13px;border-radius:9px;background:var(--accent);color:#0D0D0F;font-weight:700;font-size:13px}
.btn-danger{width:100%;padding:12px;border-radius:13px;border:1px solid rgba(255,107,107,0.2);background:rgba(255,107,107,0.06);color:var(--danger);font-size:13px;font-weight:700;margin-top:9px}
.btn-outline{width:100%;padding:11px;border-radius:13px;border:1px solid var(--border);color:var(--text2);font-size:13px;font-weight:600;margin-top:7px}
 
/* ROWS */
.sec{font-size:11px;font-weight:700;color:var(--text4);margin-bottom:8px;letter-spacing:.5px;text-transform:uppercase}
.row{display:flex;align-items:center;padding:10px 12px;margin-bottom:5px;background:var(--card);border-radius:11px;border:1px solid rgba(255,255,255,0.04);animation:fadeIn .25s ease}
.row .ri{font-size:19px;flex-shrink:0}
.row .rinfo{flex:1;margin-left:9px}
.row .rname{font-size:13px;font-weight:600;color:#DDD}
.row .rdate{font-size:10px;color:var(--text4);margin-top:1px}
.row .rsum{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.del-btn{background:rgba(255,107,107,0.1);color:var(--danger);border-radius:7px;width:26px;height:26px;font-size:11px;display:flex;align-items:center;justify-content:center;margin-left:5px;flex-shrink:0}
 
/* CHARTS */
.chart-box{background:rgba(255,255,255,0.02);border-radius:13px;padding:13px 10px;border:1px solid rgba(255,255,255,0.04);margin-bottom:13px}
.chart-box canvas{width:100%;display:block}
.cat-item{display:flex;align-items:center;gap:7px;padding:6px 9px;background:rgba(255,255,255,0.02);border-radius:8px;margin-bottom:3px}
.cdot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.cname{flex:1;font-size:12px;font-weight:600}
.cval{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.cpct{font-size:10px;color:var(--text3);width:28px;text-align:right}
 
/* STATS */
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:13px}
.stat{text-align:center;padding:11px 5px;background:var(--card);border-radius:11px;border:1px solid rgba(255,255,255,0.04)}
.sv{font-size:14px;font-weight:800;color:var(--accent)}
.sl{font-size:9px;color:var(--text4);margin-top:2px;font-weight:600}
 
/* TIPS */
.tip{background:linear-gradient(135deg,rgba(78,205,196,0.07),rgba(69,183,209,0.04));border:1px solid rgba(78,205,196,0.13);border-radius:12px;padding:12px;margin-bottom:8px}
.tip-lbl{font-size:10px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.tip-txt{font-size:12px;line-height:1.55;color:var(--text2)}
 
/* SAVINGS */
.sav-card{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:13px;margin-bottom:9px}
.sav-prog{height:7px;background:rgba(255,255,255,0.06);border-radius:4px;overflow:hidden;margin:7px 0}
.sav-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .6s}
.sav-info{display:flex;justify-content:space-between;font-size:11px;color:var(--text3)}
 
/* BANK CARDS */
.bank-card{border-radius:14px;margin-bottom:10px;overflow:hidden;border:1px solid rgba(255,255,255,0.07)}
.bank-header{display:flex;align-items:center;gap:12px;padding:14px}
.bank-logo{width:46px;height:46px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:900;font-size:18px;letter-spacing:-1px}
.bank-logo-kaspi{background:linear-gradient(135deg,#CC0000,#FF1A1A)}
.bank-logo-forte{background:linear-gradient(135deg,#1A1A6E,#2D2D8E)}
.bank-logo-otbasy{background:linear-gradient(135deg,#006633,#009944)}
.bank-title{flex:1}
.bank-name{font-size:15px;font-weight:800;color:var(--text)}
.bank-rate{font-size:12px;color:var(--green);font-weight:700;margin-top:1px}
.bank-deposit-badge{background:rgba(78,205,196,0.1);border:1px solid rgba(78,205,196,0.2);border-radius:9px;padding:5px 10px;text-align:right}
.bank-deposit-lbl{font-size:9px;color:var(--text3);font-weight:600}
.bank-deposit-val{font-size:14px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.bank-body{padding:0 14px 14px}
.bank-prog-track{height:5px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden;margin-bottom:5px}
.bank-prog-fill{height:100%;border-radius:3px;transition:width .6s}
.bank-prog-kaspi{background:linear-gradient(90deg,#CC0000,#FF4444)}
.bank-prog-forte{background:linear-gradient(90deg,#1A1A6E,#5555CC)}
.bank-prog-otbasy{background:linear-gradient(90deg,#006633,#00BB55)}
.bank-info-row{display:flex;justify-content:space-between;font-size:11px;color:var(--text3);margin-bottom:8px}
.bank-add-row{display:flex;gap:7px}
.bank-add-row .field{margin:0;flex:1;font-size:13px;padding:8px 11px}
 
/* SETTINGS */
.set-card{padding:13px;background:var(--card);border-radius:13px;border:1px solid rgba(255,255,255,0.04);margin-bottom:9px}
.set-lbl{font-size:11px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.set-val{margin-top:4px;font-size:16px;font-weight:700;color:var(--text)}
.set-val .ed{font-size:12px;opacity:.4}
.bud-edit{display:flex;gap:7px;margin-top:7px}
.bud-edit .field{margin:0;flex:1}
.cc-row{display:flex;align-items:center;padding:7px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
 
/* NAV */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;justify-content:space-around;background:rgba(13,13,15,0.96);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border-top:1px solid rgba(255,255,255,0.06);padding:6px 0 calc(10px + var(--sb));z-index:100}
.nav-btn{display:flex;flex-direction:column;align-items:center;font-weight:600;transition:color .2s;padding:4px 5px;color:var(--text4);font-size:9px;min-width:54px}
.nav-btn:active{transform:scale(.94)}
.nav-btn .ni{font-size:18px;margin-bottom:1px;transition:font-size .15s}
.nav-btn.on{color:var(--accent)}
.nav-btn.on .ni{font-size:20px}
 
/* TOAST */
.toast{position:fixed;bottom:calc(74px + var(--sb));left:50%;transform:translateX(-50%);background:#1A1A1E;color:var(--accent);padding:9px 22px;border-radius:30px;font-size:13px;font-weight:700;z-index:300;border:1px solid rgba(78,205,196,0.3);animation:toastIn .3s ease;pointer-events:none;white-space:nowrap}
.empty{text-align:center;color:var(--text4);padding:30px 0;font-size:13px}
.about-txt{margin-top:18px;text-align:center;padding:10px;font-size:11px;color:var(--text4);line-height:1.8}
</style>
</head>

/* CHARTS */
function drawPie(cv,data){
  const ctx=cv.getContext('2d'),dpr=devicePixelRatio||1;
  const w=cv.parentElement.clientWidth-20,ht=170;
  cv.width=w*dpr;cv.height=ht*dpr;cv.style.width=w+'px';cv.style.height=ht+'px';
  ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,ht);
  const tot=data.reduce((s,d)=>s+d.value,0);if(!tot)return;
  let a=-Math.PI/2;
  data.forEach(d=>{
    const sl=(d.value/tot)*Math.PI*2;
    ctx.beginPath();ctx.arc(w/2,ht/2,75,a,a+sl);ctx.arc(w/2,ht/2,44,a+sl,a,true);
    ctx.closePath();ctx.fillStyle=d.color;ctx.fill();a+=sl+.025;
  });
}
function drawBars(cv,data,color){
  const ctx=cv.getContext('2d'),dpr=devicePixelRatio||1;
  const w=cv.parentElement.clientWidth-20,ht=120;
  cv.width=w*dpr;cv.height=ht*dpr;cv.style.width=w+'px';cv.style.height=ht+'px';
  ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,ht);
  const max=Math.max(...data.map(d=>d.v),1);
  const bw=Math.min(20,(w-24)/data.length-5);
  const gap=(w-bw*data.length)/(data.length+1);
  const ch=ht-20;
  data.forEach((d,i)=>{
    const x=gap+i*(bw+gap),bh=(d.v/max)*(ch-4),y=ch-bh;
    if(bh>0){
      ctx.beginPath();const r=Math.min(4,bw/2);
      ctx.moveTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.lineTo(x+bw-r,y);
      ctx.quadraticCurveTo(x+bw,y,x+bw,y+r);ctx.lineTo(x+bw,ch);ctx.lineTo(x,ch);
      ctx.closePath();ctx.fillStyle=color||'#4ECDC4';ctx.fill();
    }
    ctx.fillStyle='#666';ctx.font=`9px -apple-system,sans-serif`;ctx.textAlign='center';
    ctx.fillText(d.l,x+bw/2,ht-3);
  });
}

  pg.appendChild(h('button',{class:_.showSavPanel?'btn-danger':'btn-primary',style:{marginBottom:'11px',fontSize:'13px'},onClick:()=>{_.showSavPanel=!_.showSavPanel;render()}},_.showSavPanel?'✕ Отмена':'＋ Новая цель'));
  if(_.showSavPanel){
    const p=h('div',{class:'panel'});p.appendChild(h('div',{class:'panel-title'},'Новая цель'));
    const n1=h('input',{type:'text',class:'field',placeholder:'Название (Отпуск, Машина...)',value:_.savName});n1.addEventListener('input',e=>{_.savName=e.target.value});p.appendChild(n1);
    const n2=h('input',{type:'text',class:'field',inputmode:'numeric',placeholder:'Сумма цели ₸',value:_.savGoal});n2.addEventListener('input',e=>{_.savGoal=e.target.value.replace(/\D/g,'')});p.appendChild(n2);
    const n3=h('input',{type:'text',class:'field',inputmode:'numeric',placeholder:'Уже накоплено ₸',value:_.savAmt});n3.addEventListener('input',e=>{_.savAmt=e.target.value.replace(/\D/g,'')});p.appendChild(n3);
    p.appendChild(h('button',{class:'btn-sm',style:{width:'100%',padding:'11px',fontSize:'13px'},onClick:()=>{
      if(!_.savName.trim()||!_.savGoal)return;
      _.savings.push({id:'s'+Date.now().toString(36),name:_.savName.trim(),goal:Number(_.savGoal),current:Number(_.savAmt||0)});
      _.savName='';_.savGoal='';_.savAmt='';_.showSavPanel=false;save();toast('✓ Цель добавлена!');
    }},'Создать цель'));
    pg.appendChild(p);
  }
  if(!_.savings.length) pg.appendChild(h('div',{class:'empty',style:{paddingTop:'12px'}},'Добавьте первую цель'));
  _.savings.forEach(sv=>{
    const pct=sv.goal?Math.min(sv.current/sv.goal*100,100):0;
    const left=Math.max(sv.goal-sv.current,0);
    const card=h('div',{class:'sav-card'});
    card.appendChild(h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'4px'}},
      h('div',null,h('div',{style:{fontSize:'14px',fontWeight:'700'}},'🎯 '+sv.name),h('div',{style:{fontSize:'10px',color:'#555',marginTop:'2px'}},left>0?`Ещё ${fmt(left)}`:'✅ Достигнуто!')),
      h('button',{class:'del-btn',onClick:()=>{_.savings=_.savings.filter(x=>x.id!==sv.id);save();toast('Удалено')}},'✕'),
    ));
    card.appendChild(h('div',{class:'sav-prog'},h('div',{class:'sav-fill',style:{width:pct+'%'}})));
    card.appendChild(h('div',{class:'sav-info'},h('span',null,fmt(sv.current)+' из '+fmt(sv.goal)),h('span',null,Math.round(pct)+'%')));
    const addI=h('input',{type:'text',class:'field',inputmode:'numeric',placeholder:'Добавить ₸',style:{marginTop:'9px',marginBottom:'6px'}});
    card.appendChild(addI);
    card.appendChild(h('button',{class:'btn-sm',style:{fontSize:'11px',padding:'6px 12px'},onClick:()=>{const v=Number(addI.value.replace(/\D/g,''));if(v>0){sv.current=Math.min(sv.current+v,sv.goal);save();toast('+'+fmt(v));render();}}},'Пополнить'));
    pg.appendChild(card);
  });
 
  // Банки
  pg.appendChild(h('div',{class:'sec',style:{marginTop:'20px'}},'🏦 Мои депозиты'));
  const totalDeps=Object.values(_.bankDeps||{}).reduce((s,v)=>s+v,0);
  if(totalDeps>0){
    pg.appendChild(h('div',{style:{background:'rgba(78,205,196,0.07)',border:'1px solid rgba(78,205,196,0.15)',borderRadius:'11px',padding:'11px 14px',marginBottom:'12px',display:'flex',justifyContent:'space-between',alignItems:'center'}},
      h('div',null,h('div',{style:{fontSize:'10px',color:'#888',fontWeight:'700',textTransform:'uppercase',letterSpacing:'.4px'}},'Всего на депозитах'),h('div',{style:{fontSize:'20px',fontWeight:'800',color:'#4ECDC4',marginTop:'2px'}},fmt(totalDeps))),
      h('div',{style:{fontSize:'28px'}},'🏦'),
    ));
  }
 
  BANKS.forEach(bank=>{
    const dep=_.bankDeps[bank.id]||0;
    const card=h('div',{class:'bank-card',style:{background:'rgba(255,255,255,0.03)'}});
    card.appendChild(h('div',{class:'bank-header'},
      h('div',{class:`bank-logo ${bank.logoClass}`},bank.logoText),
      h('div',{class:'bank-title'},
        h('div',{class:'bank-name'},bank.name),
        h('div',{class:'bank-rate'},bank.rate),
      ),
      h('div',{class:'bank-deposit-badge'},
        h('div',{class:'bank-deposit-lbl'},'Накоплено'),
        h('div',{class:'bank-deposit-val'},dep>0?fmt(dep):'—'),
      ),
    ));
    card.appendChild(h('div',{class:'bank-body'},
      dep>0?h('div',null,
        h('div',{class:'bank-prog-track'},h('div',{class:`bank-prog-fill ${bank.progClass}`,style:{width:'100%'}})),
        h('div',{class:'bank-info-row'},h('span',null,bank.details),h('span',null,bank.min)),
      ):h('div',{class:'bank-info-row',style:{marginBottom:'8px'}},h('span',null,bank.details)),
      h('div',{class:'bank-add-row'},
        h('input',{type:'text',class:'field',inputmode:'numeric',placeholder:`Сумма на ${bank.shortName} ₸`,id:`dep-${bank.id}`}),
        h('button',{class:'btn-sm',onClick:()=>{
          const inp=document.getElementById(`dep-${bank.id}`);
          const v=Number((inp?inp.value:'').replace(/\D/g,''));
          if(v>0){if(!_.bankDeps)_.bankDeps={};_.bankDeps[bank.id]=(_.bankDeps[bank.id]||0)+v;save();toast(`✓ +${fmt(v)} в ${bank.shortName}`);render();}
          else toast('Введите сумму');
        }},'＋'),
      ),
      dep>0?h('button',{class:'btn-outline',style:{marginTop:'5px',fontSize:'11px',padding:'7px'},onClick:()=>{
        if(confirm(`Обнулить депозит в ${bank.name}?`)){_.bankDeps[bank.id]=0;save();render();}
      }},'Сбросить депозит'):null,
    ));
    pg.appendChild(card);
  });
  pg.appendChild(h('div',{style:{fontSize:'10px',color:'#444',marginTop:'6px',textAlign:'center'}},'* Ставки ориентировочные. Уточняйте в приложениях банков.'));
  return pg;
}
 
/* SETTINGS */
function renderSettings(){
  const pg=h('div',{class:'page'});
  pg.appendChild(h('div',{class:'sec'},'Настройки'));
  const bc=h('div',{class:'set-card'});
  bc.appendChild(h('div',{class:'set-lbl'},'Бюджет на месяц'));
  if(_.editBudget){
    const bi=h('input',{type:'text',inputmode:'numeric',class:'field',value:String(_.budget),style:{margin:'0',flex:'1'}});
    bi.addEventListener('input',e=>{_.budInp=e.target.value.replace(/\D/g,'')});
    bc.appendChild(h('div',{class:'bud-edit'},bi,h('button',{class:'btn-sm',onClick:()=>{const v=parseInt(_.budInp||bi.value);if(v>0)_.budget=v;_.editBudget=false;save();render()}},'✓')));
  }else{
    bc.appendChild(h('button',{class:'set-val',style:{display:'block',textAlign:'left',cursor:'pointer'},onClick:()=>{_.budInp=String(_.budget);_.editBudget=true;render()}},fmt(_.budget),' ',h('span',{class:'ed'},'✎')));
  }
  pg.appendChild(bc);
  const pc=h('div',{class:'set-card'});
  pc.appendChild(h('div',{class:'set-lbl'},'ПИН-код'));
  if(_.pin){
    pc.appendChild(h('div',{style:{display:'flex',gap:'8px',marginTop:'7px',alignItems:'center'}},
      h('div',{style:{flex:'1',fontSize:'13px',color:'#00B894',fontWeight:'600'}},'✓ Установлен'),
      h('button',{class:'btn-sm',style:{background:'var(--danger)',fontSize:'12px',padding:'6px 12px'},onClick:()=>{_.pin=null;save();toast('ПИН удалён')}},'Удалить'),
    ));
  }else{
    pc.appendChild(h('button',{class:'btn-sm',style:{marginTop:'7px',fontSize:'12px'},onClick:()=>{_.pinSetup=true;_.pinStep=1;_.pinInp='';_.pinFirst='';_.pinLocked=true;const ps=document.getElementById('pin-screen');renderPin();ps.style.display='flex';}},'Установить ПИН'));
  }
  pg.appendChild(pc);
  const cc=h('div',{class:'set-card'});
  cc.appendChild(h('div',{class:'set-lbl'},'Мои категории'));
  if(!_.cats.length) cc.appendChild(h('div',{style:{fontSize:'12px',color:'#555',marginTop:'5px'}},'Нет своих категорий'));
  _.cats.forEach(c=>{
    cc.appendChild(h('div',{class:'cc-row'},
      h('span',{style:{fontSize:'17px'}},c.icon),
      h('span',{style:{flex:'1',marginLeft:'7px',fontSize:'12px',fontWeight:'600'}},c.name),
      h('div',{class:'cdot',style:{background:c.color,width:'10px',height:'10px'}}),
      h('button',{class:'del-btn',style:{marginLeft:'6px'},onClick:()=>{_.cats=_.cats.filter(x=>x.id!==c.id);save();toast('Удалено')}},'✕'),
    ));
  });
  pg.appendChild(cc);
  pg.appendChild(h('button',{class:'btn-outline',onClick:()=>exportCSV()},'📥 Экспорт в CSV'));
  pg.appendChild(h('button',{class:'btn-danger',onClick:()=>{if(confirm('Удалить ВСЕ данные?')){_.expenses=[];_.savings=[];_.bankDeps={kaspi:0,forte:0,otbasy:0};save();toast('Очищено');}}},'🗑 Удалить все данные'));
  pg.appendChild(h('div',{class:'about-txt'},'Мои Финансы v2.1 · Офлайн · Данные на устройстве'));
  return pg;
}
 
/* NAV */
function renderNav(){
  const tabs=[{id:'add',ni:'＋',l:'Ввод'},{id:'list',ni:'☰',l:'История'},{id:'analytics',ni:'◔',l:'Аналитика'},{id:'savings',ni:'🎯',l:'Цели'},{id:'settings',ni:'⚙',l:'Ещё'}];
  return h('div',{class:'nav'},...tabs.map(t=>h('button',{class:`nav-btn${_.view===t.id?' on':''}`,onClick:()=>{_.view=t.id;render()}},h('span',{class:'ni'},t.ni),t.l)));
}
 
/* RENDER */
function render(){
  const app=document.getElementById('app');app.innerHTML='';
  app.appendChild(renderHeader());
  switch(_.view){
    case'add':      app.appendChild(renderAdd());       break;
    case'list':     app.appendChild(renderList());      break;
    case'analytics':app.appendChild(renderAnalytics()); break;
    case'savings':  app.appendChild(renderSavings());   break;
    case'settings': app.appendChild(renderSettings());  break;
  }
  app.appendChild(renderNav());
  if(_.toast) app.appendChild(h('div',{class:'toast'},_.toast));
}
 
if(_.pinLocked){renderPin();document.getElementById('pin-screen').style.display='flex';}
else{render();}
</script>
</body>
</html>
