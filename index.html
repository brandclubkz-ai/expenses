<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#06061a">
<title>Мой Блокнот</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06061a; --s1:#0e0f26; --s2:#161839; --s3:#1f2250; --line:#23254c;
  --tx:#eceaf6; --tx2:#a9abc6; --mut:#6f7294;
  --acc:#8f96ff; --acc2:#5158e0;
  --exp:#f08080; --inc:#45d09a; --warn:#fab219;
  --r:18px; --rs:12px;
  --font:'Geologica',-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font-family:var(--font);font-size:15px;line-height:1.4;font-weight:400}
body{min-height:100vh;min-height:100dvh}
body.lock{overflow:hidden}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
input[type=number]{-moz-appearance:textfield}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
#app{max-width:540px;margin:0 auto;padding:0 14px calc(96px + env(safe-area-inset-bottom))}

/* header */
.hd{display:flex;justify-content:space-between;align-items:flex-end;padding:calc(18px + env(safe-area-inset-top)) 2px 14px}
.hd h1{font-size:23px;font-weight:700;letter-spacing:-.03em}
.hd p{font-size:12px;color:var(--mut);margin-top:1px}
.cap{text-align:right}
.cap small{display:block;font-size:11px;color:var(--mut)}
.cap b{font-size:16px;font-weight:600;color:var(--acc)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(8,8,30,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav div{max-width:540px;margin:0 auto;display:flex}
.nav button{flex:1;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mut);font-size:11px;font-weight:500}
.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--acc)}

/* blocks */
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card h3{font-size:15px;font-weight:600;letter-spacing:-.01em;margin-bottom:2px}
.card .sub{font-size:12px;color:var(--mut);margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.sp{justify-content:space-between}
.mut{color:var(--mut)} .tx2{color:var(--tx2)}
.exp{color:var(--exp)} .inc{color:var(--inc)} .acc{color:var(--acc)} .warn{color:var(--warn)}
.sm{font-size:12px} .xs{font-size:11px}
.big{font-size:34px;font-weight:700;letter-spacing:-.04em;line-height:1.1}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mnav b{font-size:18px;font-weight:600;letter-spacing:-.02em}
.mnav button{width:38px;height:38px;border-radius:50%;background:var(--s1);border:1px solid var(--line);color:var(--tx2);font-size:17px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:11px 12px}
.kpi span{display:block;font-size:11px;color:var(--mut);margin-bottom:3px}
.kpi b{font-size:16px;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:500;background:var(--s2);color:var(--tx2)}
.chip.bad{background:rgba(240,128,128,.14);color:var(--exp)}
.chip.good{background:rgba(69,208,154,.14);color:var(--inc)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 16px;border-radius:var(--rs);font-weight:600;font-size:14px;background:var(--s2);border:1px solid var(--line);color:var(--tx)}
.btn.pri{background:var(--acc2);border-color:var(--acc2);color:#fff}
.btn.ghost{background:none;border-style:dashed;color:var(--acc);font-weight:500}
.btn.dng{color:var(--exp)}
.btn.w{width:100%}
.btn.s{padding:9px 13px;font-size:13px}
.btn.g{background:#1d6b4c;border-color:#1d6b4c;color:#fff}
.btn.rd{background:#8a3340;border-color:#8a3340;color:#fff}
.btns{display:flex;gap:8px}
.btns .btn{flex:1}
.inp{width:100%;padding:11px 13px;border-radius:var(--rs);border:1px solid var(--line);background:var(--bg);color:var(--tx);font-size:15px;min-width:0}
.inp.s{padding:8px 10px;font-size:14px}
.inp::placeholder{color:var(--mut)}
.fld{margin-bottom:10px}
.fld label{display:block;font-size:12px;color:var(--tx2);margin-bottom:5px}
.bar{height:6px;border-radius:3px;background:var(--s2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.seg{display:flex;background:var(--s1);border:1px solid var(--line);border-radius:var(--rs);padding:3px;margin-bottom:12px}
.seg button{flex:1;padding:8px;border-radius:9px;font-size:13px;font-weight:500;color:var(--mut)}
.seg button.on{background:var(--s3);color:var(--tx)}
.empty{text-align:center;padding:34px 16px;color:var(--mut)}
.empty b{display:block;color:var(--tx2);font-weight:500;margin-bottom:4px}
.fab{position:fixed;right:max(16px,calc(50vw - 254px));bottom:calc(74px + env(safe-area-inset-bottom));z-index:30;padding:14px 20px;border-radius:99px;background:var(--acc2);color:#fff;font-weight:600;box-shadow:0 8px 28px rgba(81,88,224,.5)}

/* transactions */
.day{margin-bottom:8px}
.dayh{width:100%;display:flex;justify-content:space-between;align-items:center;padding:11px 13px;background:var(--s1);border:1px solid var(--line);border-radius:14px;font-size:13px;color:var(--tx2);font-weight:500}
.dayh i{font-style:normal;color:var(--mut);margin-right:7px;display:inline-block;transition:transform .15s}
.dayh.open i{transform:rotate(90deg)}
.tx{width:100%;display:flex;align-items:center;gap:11px;padding:9px 6px 9px 10px;text-align:left;border-bottom:1px solid rgba(35,37,76,.6)}
.tx:last-child{border-bottom:none}
.ico{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.tx .nm{flex:1;min-width:0}
.tx .nm b{display:block;font-size:14px;font-weight:500}
.tx .nm span{display:block;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .am{font-weight:600;font-size:14px}

/* charts */
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.donut{display:flex;align-items:center;gap:14px}
.donut svg{width:128px;height:128px;flex-shrink:0}
.lg{flex:1;min-width:0}
.lg div{display:flex;align-items:center;gap:7px;font-size:13px;padding:4px 0}
.lg i{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.lg span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tx2)}
.lg em{font-style:normal;color:var(--mut);font-size:12px}
.lg b{font-weight:500}
.key{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--tx2);margin-top:10px}
.key span{display:flex;align-items:center;gap:6px}
.key i{width:14px;height:3px;border-radius:2px}
.cmp{padding:9px 0;border-bottom:1px solid rgba(35,37,76,.6)}
.cmp:last-child{border:none}
.cmp .bars{margin-top:6px;display:grid;gap:3px}
.cmp .bars i{display:block;height:6px;border-radius:0 3px 3px 0;min-width:2px}
#tip{position:fixed;z-index:200;pointer-events:none;background:#fff;color:#14152e;font-size:12px;font-weight:500;padding:6px 10px;border-radius:9px;box-shadow:0 6px 20px rgba(0,0,0,.45);max-width:230px;display:none;white-space:pre-line}

/* sheets */
.ov{position:fixed;inset:0;z-index:100;background:rgba(2,2,12,.72);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--s1);border:1px solid var(--line);border-bottom:none;border-radius:24px 24px 0 0;width:100%;max-width:540px;max-height:92dvh;overflow-y:auto;padding:20px 16px calc(24px + env(safe-area-inset-bottom));animation:up .22s ease-out}
.sheet h2{font-size:19px;font-weight:600;letter-spacing:-.02em;margin-bottom:14px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.cats button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:11px;color:var(--tx2)}
.cats button span{font-size:20px}
.cats button.on{border-color:var(--acc);background:var(--s3);color:var(--tx)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:6px 10px;border-radius:99px;border:1px solid var(--line);background:var(--bg);font-size:12px;color:var(--tx2)}
.chips button.on{border-color:var(--acc);background:var(--s3);color:var(--tx)}
.ins{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid rgba(35,37,76,.6);font-size:14px;line-height:1.45}
.ins:last-child{border:none}
.ins>span{font-size:18px;line-height:1.3}
.verdict{padding:16px;border-radius:var(--r);background:var(--s2);margin-bottom:12px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{font-weight:500;color:var(--mut);font-size:11px;text-align:right;padding:6px 4px}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td{padding:8px 4px;border-top:1px solid rgba(35,37,76,.6);text-align:right}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:300;background:#fff;color:#14152e;padding:11px 16px;border-radius:14px;font-size:14px;font-weight:500;display:none;gap:14px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:92vw}
#toast button{color:var(--acc2);font-weight:600}

/* pin */
.pin{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.pin h2{font-size:24px;font-weight:700;letter-spacing:-.03em;margin-bottom:6px}
.dots{display:flex;gap:12px;margin:22px 0}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
.dots i.on{background:var(--acc);border-color:var(--acc)}
.pad{display:grid;grid-template-columns:repeat(3,70px);gap:12px}
.pad button{width:70px;height:70px;border-radius:50%;background:var(--s1);border:1px solid var(--line);font-size:24px;font-weight:500}
.pad button:active{background:var(--s3)}
</style>
</head>
<body>
<div id="app"></div>
<div id="tip"></div>
<div id="toast"></div>
<script>
"use strict";
/* ============ Хранилище (ключи те же, что в прежней версии — данные сохраняются) ============ */
const LS={get(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const AI_MODEL="claude-sonnet-5-5";
const SEED={pin:"",usdRate:500,
  banks:[
    {id:"kaspi",name:"Kaspi Bank",icon:"🔴",accounts:[{id:"kaspi_main",name:"Основной счёт",balance:0}]},
    {id:"otbasy",name:"Отбасы Банк",icon:"🏠",accounts:[{id:"otb1",name:"Депозит",balance:0,monthlyGoal:0,rewardRate:2,reward:0,targetSum:0}]},
    {id:"forte",name:"Forte Bank",icon:"🟢",accounts:[{id:"forte_usd",name:"Доллары",balance:0,currency:"$",avgPrice:0}]}],
  debts:[],
  budget:[{id:"e1",name:"Ипотека",amount:0,icon:"🏠"},{id:"e2",name:"Еда и кафе",amount:0,icon:"🍔"},{id:"e5",name:"Коммуналка и интернет",amount:0,icon:"💡"},{id:"e6",name:"Подписки и связь",amount:0,icon:"📱"},{id:"e4",name:"Другое",amount:0,icon:"🏷️"}],
  income:{salary:0,bonus:0,additional:0},transactions:[]};

/* Палитра графиков: 8 различимых оттенков, проверенных для тёмного фона */
const P={blue:"#3987e5",orange:"#d95926",aqua:"#199e70",yellow:"#c98500",magenta:"#d55181",green:"#2a9a2a",violet:"#9085e9",red:"#e66767",gray:"#6b6f8a"};
const CATS=[
  {id:"food",name:"Продукты",icon:"🛒",color:P.blue},{id:"cafe",name:"Кафе",icon:"☕",color:P.orange},
  {id:"entertainment",name:"Развлечения",icon:"🎉",color:P.magenta},{id:"shopping",name:"Покупки",icon:"🛍️",color:P.yellow},
  {id:"transport",name:"Транспорт",icon:"🚗",color:P.aqua},{id:"taxi",name:"Такси",icon:"🚕",color:P.violet},
  {id:"health",name:"Здоровье",icon:"💊",color:P.green},{id:"clothes",name:"Одежда",icon:"👕",color:P.red},
  {id:"housing",name:"Ипотека",icon:"🏠",color:P.red},{id:"utilities",name:"Ком. услуги",icon:"🔧",color:P.aqua},
  {id:"subscriptions",name:"Подписки",icon:"📱",color:P.blue},{id:"telecom",name:"Связь",icon:"📞",color:P.magenta},
  {id:"gifts",name:"Подарки",icon:"🎁",color:P.green},{id:"accountant",name:"Бухгалтер",icon:"📋",color:P.orange},
  {id:"education",name:"Образование",icon:"📚",color:P.yellow},{id:"other",name:"Другое",icon:"🏷️",color:P.gray}];
const INC_CATS=[
  {id:"salary",name:"Зарплата",icon:"💼",color:P.aqua},{id:"freelance",name:"Доп. доход",icon:"💻",color:P.blue},
  {id:"bonus_in",name:"Премия",icon:"🎯",color:P.violet},{id:"return",name:"Возврат долга",icon:"💸",color:P.green},
  {id:"other_in",name:"Другое",icon:"💰",color:P.gray}];
const FIXED=["housing","utilities","subscriptions","telecom","accountant"];
const LEGACY_MAP={food:"Еда и кафе",cafe:"Еда и кафе",accountant:"Бухгалтер",subscriptions:"Подписки и связь",telecom:"Подписки и связь",utilities:"Коммуналка и интернет",housing:"Ипотека"};
const MO=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const MO_IN=["январе","феврале","марте","апреле","мае","июне","июле","августе","сентябре","октябре","ноябре","декабре"];
const MO_GEN=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const MO_SH=["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];

/* ============ Утилиты ============ */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const fmt=n=>new Intl.NumberFormat("ru-RU").format(Math.round(Math.abs(n||0)));
const sfmt=n=>(n<0?"−":"+")+fmt(n);
const fmtK=n=>{n=Math.abs(n);if(n>=1e6)return (n/1e6).toFixed(n>=1e7?0:1).replace(".0","").replace(".",",")+" млн";if(n>=1e3)return Math.round(n/1e3)+" тыс";return String(Math.round(n))};
const td=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const ymNow=()=>td().slice(0,7);
const ymParts=ym=>[+ym.slice(0,4),+ym.slice(5,7)];
const ymShift=(ym,k)=>{let [y,m]=ymParts(ym);m+=k;while(m<1){m+=12;y--}while(m>12){m-=12;y++}return y+"-"+pad(m)};
const daysIn=ym=>{const [y,m]=ymParts(ym);return new Date(y,m,0).getDate()};
const moName=ym=>MO[ymParts(ym)[1]-1];
const moIn=ym=>MO_IN[ymParts(ym)[1]-1];
const moGen=ym=>MO_GEN[ymParts(ym)[1]-1];
const moTitle=ym=>moName(ym)+" "+ymParts(ym)[0];
const custom=()=>(typeof D!=="undefined"&&D&&D.customCats)||[];
const expCats=()=>[...CATS,...custom().filter(c=>c.type!=="income"&&!c.hidden)];
const incCats=()=>[...INC_CATS,...custom().filter(c=>c.type==="income"&&!c.hidden)];
const PAL=[P.blue,P.orange,P.aqua,P.yellow,P.magenta,P.green,P.violet,P.red];
const EMO=["⭐","🐶","🐱","👶","💇","🏋️","⚽","🎮","✈️","🏖️","🚬","🍺","💄","🔨","🚙","⛽","🏥","🎓","💻","📦","🧾","💍","🎬","🌿"];
const gc=id=>[...CATS,...INC_CATS,...custom()].find(c=>c.id===id)||{id,name:id,icon:"📌",color:P.gray};
const sum=(a,f=x=>x.amount)=>a.reduce((s,x)=>s+(+f(x)||0),0);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const niceMax=v=>{if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v))),f=v/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p};
const dayLabel=d=>{if(d===td())return "Сегодня";const [y,m,dd]=d.split("-").map(Number);return new Date(y,m-1,dd).toLocaleDateString("ru-RU",{day:"numeric",month:"long",weekday:"short"})};

/* ============ Состояние ============ */
let D,H=[];
const ui={locked:true,pinSetup:false,pin:"",pinErr:false,tab:"tx",ym:ymNow(),seg:"banks",q:"",open:{},modal:null,ai:"",aiLoading:false,aiKey:""};
function load(){
  D=LS.get("fv5-data")||JSON.parse(JSON.stringify(SEED));
  D.banks=D.banks||[];D.debts=D.debts||[];D.budget=D.budget||[];D.transactions=D.transactions||[];
  D.customCats=D.customCats||[];D.recurring=D.recurring||[];
  D.income=Object.assign({salary:0,bonus:0,additional:0},D.income);D.usdRate=D.usdRate||500;
  const h=LS.get("fv5-hist");H=Array.isArray(h)?h:(h&&h.value?(()=>{try{return JSON.parse(h.value)}catch{return []}})():[]);
  const a=LS.get("fv5-ai");ui.ai=typeof a==="string"?a:(a&&a.value)||"";
  ui.aiKey=LS.get("fv5-key")||"";
  ui.pinSetup=!D.pin;ui.locked=true;
  ui.open[td()]=true;
}
function save(){LS.set("fv5-data",D);LS.set("fv5-hist",H)}
function log(t){H.unshift({date:td(),time:new Date().toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"}),text:t});H=H.slice(0,200)}

/* ============ Расчёты ============ */
const monthTx=ym=>D.transactions.filter(t=>t.date&&t.date.slice(0,7)===ym);
const expOf=ym=>monthTx(ym).filter(t=>t.type==="expense");
const incOf=ym=>monthTx(ym).filter(t=>t.type==="income");
function byCat(list){const m={};list.forEach(t=>{m[t.category]=(m[t.category]||0)+t.amount});return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function byDay(list,ym){const n=daysIn(ym),a=new Array(n).fill(0);list.forEach(t=>{const d=+t.date.slice(8,10);if(d>=1&&d<=n)a[d-1]+=t.amount});return a}
function budgetOf(cat){
  const B=D.budget;let b=B.find(x=>Array.isArray(x.cats)&&x.cats.includes(cat));if(b)return b;
  const nm=LEGACY_MAP[cat];b=nm&&B.find(x=>!x.cats&&x.name===nm);if(b)return b;
  return B.find(x=>!x.cats&&x.name==="Другое")||null;
}
function budgetStats(ym){
  const spent={};let free=0;
  expOf(ym).forEach(t=>{const b=budgetOf(t.category);if(b)spent[b.id]=(spent[b.id]||0)+t.amount;else free+=t.amount});
  return {rows:D.budget.map(b=>({b,spent:spent[b.id]||0})),free};
}
function totals(){
  const acc=D.banks.flatMap(b=>b.accounts);
  const tTg=sum(acc.filter(a=>(a.currency||"₸")==="₸"),a=>a.balance);
  const tUsd=sum(acc.filter(a=>a.currency==="$"),a=>a.balance);
  const tInv=tUsd*D.usdRate,tDebts=sum(D.debts),tBudget=sum(D.budget);
  const mIncome=D.income.salary+D.income.additional+Math.round(D.income.bonus/3);
  const sGoal=sum(acc.filter(a=>a.monthlyGoal),a=>a.monthlyGoal);
  return {tTg,tUsd,tInv,tDebts,tBudget,mIncome,sGoal,freeUsd:mIncome-tBudget-sGoal,nw:tTg+tInv+tDebts};
}
function monthsWithData(){const s=new Set(D.transactions.map(t=>t.date&&t.date.slice(0,7)).filter(Boolean));s.add(ymNow());return [...s].sort().reverse()}

function applyRecurring(){
  const cur=ymNow(),today=new Date().getDate();let n=0;
  D.recurring.forEach(r=>{let m=r.last?ymShift(r.last,1):cur,g=0;
    while(m<=cur&&g++<24){const d=Math.min(r.day,daysIn(m));if(m===cur&&today<d)break;
      D.transactions.push({id:uid(),type:r.type,category:r.category,amount:r.amount,note:r.note||"",date:m+"-"+pad(d),rec:r.id});r.last=m;n++;m=ymShift(m,1)}});
  if(n){log(`🔁 Записано повторяющихся платежей: ${n}`);save()}return n;
}
/* Автоматическое сравнение месяца a с месяцем b */
function analyze(a,b){
  const isCur=a===ymNow(),nA=daysIn(a),day=isCur?new Date().getDate():nA;
  const A=expOf(a),Bfull=expOf(b),B=isCur?Bfull.filter(t=>+t.date.slice(8,10)<=day):Bfull;
  const tA=sum(A),tB=sum(B),tBfull=sum(Bfull),diff=tA-tB,pct=tB?Math.round(diff/tB*100):null;
  const cA=Object.fromEntries(byCat(A)),cB=Object.fromEntries(byCat(B));
  const rows=[...new Set([...Object.keys(cA),...Object.keys(cB)])].map(id=>({id,c:gc(id),a:cA[id]||0,b:cB[id]||0,d:(cA[id]||0)-(cB[id]||0)})).sort((x,y)=>y.a-x.a||y.b-x.b);
  const ins=[],basis=isCur?`за те же ${day} дн. ${moGen(b)}`:`в ${moIn(b)}`;
  if(!A.length){ins.push({ic:"📭",t:`В ${moIn(a)} пока нет записанных трат.`});return {a,b,isCur,day,tA,tB,tBfull,diff,pct,rows,ins,basis}}
  if(!Bfull.length)ins.push({ic:"ℹ️",t:`За ${moName(b).toLowerCase()} записей нет, сравнивать не с чем. Выберите другой месяц.`});
  else if(Math.abs(diff)<Math.max(1000,tB*.03))ins.push({ic:"⚖️",t:`Траты почти такие же, как ${basis}: ${fmt(tA)} ₸ против ${fmt(tB)} ₸.`});
  else ins.push({ic:diff>0?"📈":"📉",tone:diff>0?"bad":"good",t:`Потрачено ${fmt(tA)} ₸. Это на ${fmt(diff)} ₸ (${Math.abs(pct)}%) ${diff>0?"больше":"меньше"}, чем ${basis} (${fmt(tB)} ₸).`});
  const thr=Math.max(3000,tA*.03),grow=r=>r.a>=r.b*3?(n=>`в ${n} раз${n%10>=2&&n%10<=4&&(n%100<12||n%100>14)?"а":""}`)(Math.round(r.a/r.b)):Math.round(r.d/r.b*100)+"%";
  const up=rows.filter(r=>r.d>thr&&r.b>0).sort((x,y)=>y.d-x.d).slice(0,3);
  const down=rows.filter(r=>r.d<-thr&&r.a>0).sort((x,y)=>x.d-y.d).slice(0,3);
  const fresh=rows.filter(r=>r.b===0&&r.a>thr).slice(0,3),gone=rows.filter(r=>r.a===0&&r.b>thr).slice(0,3);
  if(Bfull.length){
    if(up.length)ins.push({ic:"🔺",tone:"bad",t:"Сильнее всего выросли: "+up.map(r=>`${r.c.name} +${fmt(r.d)} ₸ (${grow(r)})`).join(", ")+"."});
    if(down.length)ins.push({ic:"🔻",tone:"good",t:"Удалось сократить: "+down.map(r=>`${r.c.name} −${fmt(r.d)} ₸ (${Math.round(-r.d/r.b*100)}%)`).join(", ")+"."});
    if(fresh.length)ins.push({ic:"🆕",t:`Появились траты, которых не было ${basis}: `+fresh.map(r=>`${r.c.name} ${fmt(r.a)} ₸`).join(", ")+"."});
    if(gone.length)ins.push({ic:"✂️",tone:"good",t:"В этот раз не тратили на: "+gone.map(r=>`${r.c.name} (было ${fmt(r.b)} ₸)`).join(", ")+"."});
  }
  const top=rows[0];if(top&&tA)ins.push({ic:top.c.icon,t:`Главная статья: ${top.c.name}, ${fmt(top.a)} ₸. Это ${Math.round(top.a/tA*100)}% всех трат месяца.`});
  const tBud=sum(D.budget);let fc=null;
  if(isCur&&day>=3){const fx=sum(A.filter(t=>FIXED.includes(t.category)));fc=fx+(tA-fx)/day*nA;
    let t=`При таком темпе к концу месяца выйдет около ${fmt(fc)} ₸${fx?" (ипотека, коммуналка и подписки посчитаны один раз)":""}`;
    if(tBfull)t+=`, в ${moIn(b)} было ${fmt(tBfull)} ₸`;
    if(tBud)t+=fc>tBud?`. Это на ${fmt(fc-tBud)} ₸ выше бюджета`:`. В бюджет ${fmt(tBud)} ₸ укладываетесь`;
    ins.push({ic:"🔮",tone:tBud&&fc>tBud?"bad":undefined,t:t+"."});
  }
  const over=budgetStats(a).rows.filter(r=>r.b.amount>0&&r.spent>r.b.amount);
  if(over.length)ins.push({ic:"⚠️",tone:"bad",t:"Бюджет превышен: "+over.map(r=>`${r.b.name} на ${fmt(r.spent-r.b.amount)} ₸`).join(", ")+"."});
  const prev3=[1,2,3].map(k=>sum(expOf(ymShift(a,-k)))).filter(v=>v>0);
  if(prev3.length>=2){const avg=sum(prev3,x=>x)/prev3.length,cmp=isCur?fc:tA;
    if(cmp){const p=Math.round((cmp-avg)/avg*100);if(Math.abs(p)>=5)ins.push({ic:"📊",tone:p>0?"bad":"good",t:`Среднее за ${prev3.length} прошлых месяца: ${fmt(avg)} ₸. ${isCur?"Прогноз этого месяца":"Этот месяц"} на ${Math.abs(p)}% ${p>0?"выше":"ниже"}.`})}}
  const dA=byDay(A,a),mx=Math.max(...dA),mxI=dA.indexOf(mx);
  ins.push({ic:"📅",t:`В среднем ${fmt(tA/day)} ₸ в день. Самый дорогой день: ${mxI+1} ${moGen(a)}, ${fmt(mx)} ₸.`});
  const [y,m]=ymParts(a);let we=0,wd=0,nwe=0,nwd=0;
  for(let i=0;i<day;i++){const w=new Date(y,m-1,i+1).getDay();if(w===0||w===6){we+=dA[i];nwe++}else{wd+=dA[i];nwd++}}
  if(nwe&&nwd){const x=we/nwe,z=wd/nwd;if(z>0&&x>z*1.25)ins.push({ic:"🛋️",t:`В выходные уходит больше: в среднем ${fmt(x)} ₸ в день против ${fmt(z)} ₸ в будни.`});else if(x>0&&z>x*1.25)ins.push({ic:"💼",t:`В будни уходит больше: в среднем ${fmt(z)} ₸ в день против ${fmt(x)} ₸ в выходные.`})}
  const bigT=[...A].sort((p,q)=>q.amount-p.amount)[0];
  if(bigT&&A.length>3)ins.push({ic:"💳",t:`Самая крупная покупка: ${gc(bigT.category).name}${bigT.note?" («"+bigT.note+"»)":""}, ${fmt(bigT.amount)} ₸, ${+bigT.date.slice(8,10)} ${moGen(a)}.`});
  const tI=sum(incOf(a));
  if(tI>0){const left=tI-tA;ins.push({ic:left>=0?"🏦":"🚨",tone:left>=0?"good":"bad",t:left>=0?`Доходы ${fmt(tI)} ₸. После трат остаётся ${fmt(left)} ₸, это ${Math.round(left/tI*100)}% дохода.`:`Траты превысили записанные доходы на ${fmt(left)} ₸.`})}
  return {a,b,isCur,day,tA,tB,tBfull,diff,pct,rows,ins,basis,fc};
}

/* ============ Графики (SVG) ============ */
const FF="Geologica,-apple-system,'Segoe UI',Roboto,sans-serif";
const C={tx:"#eceaf6",tx2:"#a9abc6",mut:"#6f7294",grid:"#23254c",bg:"#06061a",s1:"#0e0f26",s2:"#161839"};
const T=(x,y,s,o={})=>`<text x="${x}" y="${y}" font-size="${o.size||10}" fill="${o.fill||C.mut}" font-weight="${o.w||400}" text-anchor="${o.a||"start"}" font-family="${FF}">${esc(s)}</text>`;
const barPath=(x,y,w,h,r)=>{r=Math.min(r,w/2,h);const b=y+h;return `M${x},${b}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${b}Z`};
const svgWrap=(w,h,inner,attrs="")=>`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" ${attrs}>${inner}</svg>`;
function donutItems(ym){
  const cats=byCat(expOf(ym)),tot=sum(cats,x=>x[1]);
  let items=cats.slice(0,6).map(([id,v])=>({c:gc(id),v}));
  const rest=sum(cats.slice(6),x=>x[1]);if(rest>0)items.push({c:{name:"Остальное",icon:"…",color:P.gray},v:rest});
  return {items,tot};
}
function donutG(items,tot,cx,cy,r,sw,centerSize){
  let g="",a0=-Math.PI/2;const gap=items.length>1?2.5/r:0;
  items.forEach(it=>{const frac=it.v/tot,a1=a0+frac*2*Math.PI,tip=`${it.c.name}: ${fmt(it.v)} ₸ (${Math.round(frac*100)}%)`;
    if(frac>.999)g+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${it.c.color}" stroke-width="${sw}" data-tip="${esc(tip)}"/>`;
    else{const s=a0+gap/2,e=Math.max(s+.005,a1-gap/2);g+=`<path d="M${cx+r*Math.cos(s)},${cy+r*Math.sin(s)}A${r},${r} 0 ${e-s>Math.PI?1:0} 1 ${cx+r*Math.cos(e)},${cy+r*Math.sin(e)}" fill="none" stroke="${it.c.color}" stroke-width="${sw}" data-tip="${esc(tip)}"/>`}
    a0=a1});
  return g+T(cx,cy-centerSize*.25,"всего",{a:"middle",size:centerSize*.6})+T(cx,cy+centerSize*.85,fmtK(tot)+" ₸",{a:"middle",size:centerSize,fill:C.tx,w:600});
}
function axisY(max,l,t,pw,ph){let g="";[0,.5,1].forEach(f=>{const y=t+ph-ph*f;g+=`<line x1="${l}" x2="${l+pw}" y1="${y}" y2="${y}" stroke="${C.grid}" stroke-width="1"/>`+T(l-5,y+3,f?fmtK(max*f):"0",{a:"end",size:9})});return g}
function dailyG(ym){ // 340×150
  const W=340,Hh=150,l=40,r=6,t=10,b=20,pw=W-l-r,ph=Hh-t-b,n=daysIn(ym),d=byDay(expOf(ym),ym);
  const isCur=ym===ymNow(),el=isCur?new Date().getDate():n,avg=sum(d,x=>x)/el,max=niceMax(Math.max(...d,1)),step=pw/n,bw=Math.max(3,Math.min(8,step-2));
  let g=axisY(max,l,t,pw,ph);
  d.forEach((v,i)=>{const x=l+i*step+(step-bw)/2,h=v/max*ph;
    if(v>0)g+=`<path d="${barPath(x,t+ph-h,bw,h,2.5)}" fill="${P.blue}" opacity="${isCur&&i===el-1?1:.85}"/>`;
    g+=`<rect x="${l+i*step}" y="${t}" width="${step}" height="${ph}" fill="transparent" data-tip="${i+1} ${moGen(ym)}: ${fmt(v)} ₸"/>`;
    if(i===0||(i+1)%5===0||i===n-1){if(!(i===n-1&&(n%5)<3&&n%5!==0))g+=T(l+i*step+step/2,Hh-5,i+1,{a:"middle",size:9})}});
  if(avg>0){const y=t+ph-avg/max*ph;g+=`<line x1="${l}" x2="${l+pw}" y1="${y}" y2="${y}" stroke="${C.tx2}" stroke-width="1" stroke-dasharray="3 3"/>`}
  return {g,W,H:Hh,avg};
}
function paceG(ym){ // 340×160 — накопительно: этот месяц против прошлого
  const W=340,Hh=160,l=40,r=44,t=10,b=20,pw=W-l-r,ph=Hh-t-b,p=ymShift(ym,-1),n=Math.max(daysIn(ym),daysIn(p));
  const isCur=ym===ymNow(),el=isCur?new Date().getDate():daysIn(ym);
  const cum=a=>{let s=0;return a.map(v=>s+=v)};const cA=cum(byDay(expOf(ym),ym)).slice(0,el),cB=cum(byDay(expOf(p),p));
  const bud=sum(D.budget),max=niceMax(Math.max(cA[cA.length-1]||0,cB[cB.length-1]||0,bud,1));
  const X=i=>l+(n>1?i/(n-1):0)*pw,Y=v=>t+ph-v/max*ph,line=a=>a.map((v,i)=>(i?"L":"M")+X(i).toFixed(1)+","+Y(v).toFixed(1)).join("");
  let g=axisY(max,l,t,pw,ph);
  if(bud>0){g+=`<line x1="${l}" x2="${l+pw}" y1="${Y(bud)}" y2="${Y(bud)}" stroke="${P.red}" stroke-width="1" stroke-dasharray="2 4"/>`+T(l+pw+4,Y(bud)+3,"бюджет",{size:9,fill:C.tx2})}
  if(cB[cB.length-1]>0)g+=`<path d="${line(cB)}" fill="none" stroke="${P.gray}" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/>`;
  if(cA.length){g+=`<path d="${line(cA)}" fill="none" stroke="${P.blue}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
    const li=cA.length-1;g+=`<circle cx="${X(li)}" cy="${Y(cA[li])}" r="4.5" fill="${P.blue}" stroke="${C.s1}" stroke-width="2"/>`+T(Math.min(X(li)+7,W-2),Y(cA[li])-7,fmtK(cA[li]),{size:10,fill:C.tx,w:600,a:X(li)+40>W?"end":"start"})}
  for(let i=0;i<n;i++){const tip=`${i+1}-е число\n${moName(ym)}: ${i<cA.length?fmt(cA[i])+" ₸":"—"}\n${moName(p)}: ${i<cB.length?fmt(cB[i])+" ₸":"—"}`;
    g+=`<rect x="${X(i)-pw/n/2}" y="${t}" width="${pw/n}" height="${ph}" fill="transparent" data-tip="${esc(tip)}"/>`;
    if(i===0||(i+1)%5===0)g+=T(X(i),Hh-5,i+1,{a:"middle",size:9})}
  return {g,W,H:Hh,p};
}
function trendG(ym){ // 340×160 — шесть месяцев, расходы и доходы
  const W=340,Hh=160,l=40,r=6,t=10,b=22,pw=W-l-r,ph=Hh-t-b,ms=[5,4,3,2,1,0].map(k=>ymShift(ym,-k));
  const e=ms.map(m=>sum(expOf(m))),inc=ms.map(m=>sum(incOf(m))),max=niceMax(Math.max(...e,...inc,1)),step=pw/6,bw=Math.min(16,step/2-5);
  let g=axisY(max,l,t,pw,ph);
  ms.forEach((m,i)=>{const cx=l+i*step+step/2,he=e[i]/max*ph,hi=inc[i]/max*ph,on=m===ym;
    if(on)g+=`<rect x="${l+i*step+2}" y="${t-4}" width="${step-4}" height="${ph+4}" rx="6" fill="${C.s2}"/>`;
    if(e[i]>0)g+=`<path d="${barPath(cx-bw-1,t+ph-he,bw,he,3)}" fill="${P.blue}"/>`;
    if(inc[i]>0)g+=`<path d="${barPath(cx+1,t+ph-hi,bw,hi,3)}" fill="${P.aqua}"/>`;
    g+=T(cx,Hh-6,MO_SH[ymParts(m)[1]-1],{a:"middle",size:10,fill:on?C.tx:C.mut,w:on?600:400});
    g+=`<rect x="${l+i*step}" y="${t}" width="${step}" height="${Hh-t}" fill="transparent" style="cursor:pointer" data-a="ym" data-v="${m}" data-tip="${esc(moTitle(m)+"\nРасходы: "+fmt(e[i])+" ₸\nДоходы: "+fmt(inc[i])+" ₸")}"/>`});
  return {g,W,H:Hh};
}

  const over=budgetStats(ui.ym).rows.filter(r=>r.b.amount>0&&r.spent>r.b.amount);
  return monthNav()+`<div class="kpis"><div class="kpi"><span>Расходы</span><b class="num exp">${fmt(E)}</b></div><div class="kpi"><span>Доходы</span><b class="num inc">${fmt(I)}</b></div><div class="kpi"><span>Сегодня</span><b class="num">${fmt(today)}</b></div></div>
  ${over.length?`<div class="card" style="border-color:rgba(240,128,128,.4)"><h3 class="exp">⚠️ Бюджет превышен</h3>${over.map(r=>`<div class="row sp sm" style="margin-top:6px"><span class="tx2">${esc(r.b.icon)} ${esc(r.b.name)}</span><span class="num">${fmt(r.spent)} из ${fmt(r.b.amount)} <b class="exp">+${fmt(r.spent-r.b.amount)}</b></span></div>`).join("")}</div>`:""}
  <input class="inp" style="margin-bottom:12px" type="search" placeholder="Поиск по категории или заметке" value="${esc(ui.q)}" data-in="q">
  <div id="txlist">${txListHtml()}</div><button class="fab" data-a="newtx">＋ Добавить</button>`;
};
/* ---- Графики ---- */
V.an=()=>{
  const ym=ui.ym,p=ymShift(ym,-1),E=expOf(ym),tE=sum(E),tI=sum(incOf(ym));
  const isCur=ym===ymNow(),day=isCur?new Date().getDate():daysIn(ym);
  const pE=sum(expOf(p).filter(t=>!isCur||+t.date.slice(8,10)<=day));
  const head=monthNav()+`<div class="card"><div class="sm mut">Потрачено в ${moIn(ym)}</div><div class="big num" style="margin:4px 0 10px">${fmt(tE)} ₸</div>
    ${deltaChip(tE,pE,isCur?`к ${day} ${moGen(p)}`:`к ${moGen(p).replace(/я$|а$/,m=>m==="я"?"ю":"у")}`)}
    <div class="row sm" style="margin-top:12px;gap:18px"><span class="mut">Доходы <b class="inc num">${fmt(tI)} ₸</b></span>${tI?`<span class="mut">Остаток <b class="num ${tI-tE<0?"exp":"acc"}">${tI-tE<0?"−":""}${fmt(tI-tE)} ₸</b></span>`:""}</div></div>
    <div class="btns" style="margin-bottom:12px"><button class="btn pri" data-a="analysis">🔍 Анализ месяцев</button><button class="btn" data-a="png">⬇ Скачать графики</button></div>`;
  const tr=trendG(ym),trend=`<div class="card"><h3>Шесть месяцев</h3><p class="sub">Нажмите на месяц, чтобы открыть его</p><div class="chart">${svgWrap(tr.W,tr.H,tr.g)}</div><div class="key"><span><i style="background:${P.blue}"></i>Расходы</span><span><i style="background:${P.aqua}"></i>Доходы</span></div></div>`;
  if(!tE)return head+`<div class="card empty"><b>В ${moIn(ym)} трат нет</b>Графики появятся после первой записи</div>`+trend;
  const {items,tot}=donutItems(ym),dl=dailyG(ym),pc=paceG(ym),an=analyze(ym,p),mx=Math.max(...an.rows.map(r=>Math.max(r.a,r.b)),1);
  return head+`<div class="card"><h3>Куда ушли деньги</h3><p class="sub">Доли категорий в расходах месяца</p><div class="donut">${svgWrap(160,160,donutG(items,tot,80,80,62,20,17))}<div class="lg">${items.map(it=>`<div><i style="background:${it.c.color}"></i><span>${esc(it.c.name)}</span><em>${Math.round(it.v/tot*100)}%</em><b class="num">${fmtK(it.v)}</b></div>`).join("")}</div></div></div>
  <div class="card"><h3>Траты по дням</h3><p class="sub">В среднем ${fmt(dl.avg)} ₸ в день (пунктир)</p><div class="chart">${svgWrap(dl.W,dl.H,dl.g)}</div></div>
  <div class="card"><h3>Темп месяца</h3><p class="sub">Сколько потрачено к каждому числу, нарастающим итогом</p><div class="chart">${svgWrap(pc.W,pc.H,pc.g)}</div><div class="key"><span><i style="background:${P.blue}"></i>${moName(ym)}</span><span><i style="background:repeating-linear-gradient(90deg,${P.gray} 0 4px,transparent 4px 7px)"></i>${moName(pc.p)}</span></div></div>
  <div class="card"><h3>Категории: ${moName(ym).toLowerCase()} и ${moName(p).toLowerCase()}</h3><p class="sub">${isCur?`Сравнение за первые ${day} дн. каждого месяца`:"Сравнение полных месяцев"}</p>
    ${an.rows.slice(0,8).map(r=>`<div class="cmp"><div class="row sp sm"><span>${r.c.icon} ${esc(r.c.name)}</span><span class="num"><b>${fmt(r.a)}</b> <span class="mut">/ ${fmt(r.b)}</span> ${r.d?`<span class="${r.d>0?"exp":"inc"}">${r.d>0?"▲":"▼"}${fmtK(r.d)}</span>`:""}</span></div><div class="bars"><i style="width:${r.a/mx*100}%;background:${P.blue}"></i><i style="width:${r.b/mx*100}%;background:${P.gray}"></i></div></div>`).join("")}
    <div class="key"><span><i style="background:${P.blue}"></i>${moName(ym)}</span><span><i style="background:${P.gray}"></i>${moName(p)}</span></div></div>`+trend;
};
/* ---- Капитал ---- */
V.cap=t=>{
  const seg=`<div class="seg"><button data-a="seg" data-v="banks" class="${ui.seg==="banks"?"on":""}">Счета</button><button data-a="seg" data-v="debts" class="${ui.seg==="debts"?"on":""}">Мне должны</button></div>`;
  const parts=[["Тенге",t.tTg,P.blue],[`Доллары ($${fmt(t.tUsd)})`,t.tInv,P.yellow],["Долги мне",t.tDebts,P.aqua]];
  const struct=`<div class="card"><h3>Из чего состоит капитал</h3><div style="margin-top:12px">${parts.map(([l,v,c])=>`<div style="margin-bottom:10px"><div class="row sp sm" style="margin-bottom:4px"><span class="tx2">${l}</span><b class="num">${fmt(v)} ₸</b></div><div class="bar"><i style="width:${t.nw>0?Math.min(100,v/t.nw*100):0}%;background:${c}"></i></div></div>`).join("")}</div>
    <div class="row sp" style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)"><span class="sm tx2">Курс доллара, ₸</span><input class="inp s num" style="width:90px;text-align:right" type="number" inputmode="decimal" value="${D.usdRate}" data-ch="rate"></div></div>`;
  if(ui.seg==="debts")return seg+`<div class="card"><div class="sm mut">Всего должны</div><div class="big num inc" style="font-size:28px;margin-top:4px">${fmt(t.tDebts)} ₸</div></div>
    ${D.debts.length?"":`<div class="empty"><b>Должников нет</b>Здесь можно вести тех, кому вы дали в долг</div>`}
    ${D.debts.map(d=>`<div class="card"><div class="row sp"><b>${esc(d.name)}</b><b class="num inc" style="font-size:18px">${fmt(d.amount)} ₸</b></div><div class="row" style="margin-top:12px"><input class="inp s" type="number" inputmode="decimal" placeholder="Сколько вернули" id="debt-${esc(d.id)}"><button class="btn s g" data-a="debtret" data-v="${esc(d.id)}">Вернули</button></div><button class="btn s ghost w" style="margin-top:8px" data-a="debtclose" data-v="${esc(d.id)}">Долг закрыт полностью</button></div>`).join("")}
    <button class="btn ghost w" data-a="modal" data-v="debt">＋ Добавить должника</button>`;
  return seg+struct+D.banks.map(b=>`<div class="row sm tx2" style="margin:16px 2px 8px;font-weight:500">${esc(b.icon)} ${esc(b.name)}${b.rate?` <span class="inc">${b.rate}% годовых</span>`:""}</div>`+b.accounts.map(a=>{
    const usd=a.currency==="$",cur=a.currency||"₸",ot=b.id==="otbasy",op=ot&&a.reward>0&&a.targetSum>0?Math.round(a.reward/a.targetSum*1e5)/100:null,k=`data-b="${esc(b.id)}" data-c="${esc(a.id)}"`;
    return `<div class="card"><div class="row sp" style="align-items:flex-start"><div><b style="font-weight:500">${esc(a.name)}</b>
      ${a.monthlyGoal>0?`<div class="xs acc">Цель: +${fmt(a.monthlyGoal)} в месяц</div>`:""}
      ${usd&&a.avgPrice>0?`<div class="xs mut">Средняя цена покупки ${fmt(a.avgPrice)} ₸</div><div class="xs ${D.usdRate>=a.avgPrice?"inc":"exp"}">${D.usdRate>=a.avgPrice?"▲":"▼"} ${((D.usdRate-a.avgPrice)/a.avgPrice*100).toFixed(1)}% к текущему курсу</div>`:""}</div>
      <div style="text-align:right"><b class="num" style="font-size:20px">${usd?"$":""}${fmt(a.balance)}${usd?"":" "+esc(cur)}</b>${usd?`<div class="xs mut num">≈ ${fmt(a.balance*D.usdRate)} ₸</div>`:""}</div></div>
      ${ot?`<div style="margin-top:12px;padding:12px;background:var(--bg);border-radius:var(--rs)"><div class="row"><div style="flex:1"><div class="xs mut" style="margin-bottom:4px">Вознаграждение (НВ)</div><input class="inp s num" type="number" inputmode="decimal" value="${a.reward||""}" placeholder="0" data-ch="accf" data-f="reward" ${k}></div><div style="flex:1"><div class="xs mut" style="margin-bottom:4px">Договорная сумма (ДС)</div><input class="inp s num" type="number" inputmode="decimal" value="${a.targetSum||""}" placeholder="0" data-ch="accf" data-f="targetSum" ${k}></div></div>
        <div class="row sp" style="margin-top:10px"><span class="xs acc">ОП = НВ / ДС × 1000</span><b class="num ${op===null?"mut":op>=16?"inc":"warn"}" style="font-size:17px">${op===null?"—":op.toFixed(2)}</b></div>
        ${op!==null?`<div class="xs ${op>=16?"inc":"warn"}" style="margin-top:3px">${op>=16?"✅ Достаточно для займа (минимум 16)":`Минимум для займа 16. Нужно ещё ${(16-op).toFixed(2)}`}</div>`:""}
        <div class="xs mut" style="margin-top:3px">Ставка ${a.rewardRate||2}% годовых + госпремия 20%</div></div>`:""}
      ${usd?`<div class="row" style="margin-top:12px"><input class="inp s" type="number" inputmode="decimal" placeholder="Сумма $" id="usd-${esc(a.id)}"><input class="inp s" style="width:90px;flex:none" type="number" inputmode="decimal" placeholder="Курс" value="${D.usdRate}" id="rate-${esc(a.id)}"></div><div class="btns" style="margin-top:8px"><button class="btn s g" data-a="usdbuy" ${k}>Купил $</button><button class="btn s rd" data-a="usdsell" ${k}>Продал $</button></div>`
      :`<div class="row" style="margin-top:12px"><input class="inp s" type="number" inputmode="decimal" placeholder="Сумма" id="amt-${esc(a.id)}"><button class="btn s g" data-a="dep" data-s="1" ${k}>Внести</button><button class="btn s rd" data-a="dep" data-s="-1" ${k}>Снять</button></div>
        <div class="row" style="margin-top:8px"><input class="inp s" type="number" inputmode="decimal" placeholder="Исправить остаток" id="set-${esc(a.id)}"><button class="btn s" data-a="setbal" ${k}>Задать</button></div>`}</div>`}).join("")).join("")
    +`<button class="btn ghost w" data-a="modal" data-v="account">＋ Добавить счёт</button>`;
};
/* ---- Бюджет ---- */
V.plan=t=>{
  const st=budgetStats(ui.ym),spentAll=sum(expOf(ui.ym));
  return monthNav()+`<div class="card"><div class="row sp"><div><div class="sm mut">Бюджет на месяц</div><div class="big num" style="font-size:28px;margin-top:3px">${fmt(t.tBudget)} ₸</div></div><div style="text-align:right"><div class="sm mut">Потрачено</div><b class="num ${t.tBudget&&spentAll>t.tBudget?"exp":""}" style="font-size:18px">${fmt(spentAll)} ₸</b></div></div>
    ${t.tBudget?`<div class="bar" style="margin-top:12px;height:8px"><i style="width:${Math.min(100,spentAll/t.tBudget*100)}%;background:${spentAll>t.tBudget?P.red:P.blue}"></i></div><div class="xs mut" style="margin-top:6px">${spentAll>t.tBudget?`Перерасход ${fmt(spentAll-t.tBudget)} ₸`:`Осталось ${fmt(t.tBudget-spentAll)} ₸`}</div>`:""}</div>
  <div class="card"><h3>Статьи бюджета</h3><p class="sub">Нажмите на статью, чтобы изменить лимит и категории</p>
    ${st.rows.map(({b,spent})=>{const p=b.amount?spent/b.amount*100:0,ov=b.amount>0&&spent>b.amount;return `<button data-a="editbud" data-v="${esc(b.id)}" style="display:block;width:100%;text-align:left;padding:10px 0;border-bottom:1px solid rgba(35,37,76,.6)"><div class="row sp sm" style="margin-bottom:6px"><span>${esc(b.icon)} ${esc(b.name)}</span><span class="num"><b class="${ov?"exp":""}">${fmt(spent)}</b> <span class="mut">из ${fmt(b.amount)}</span></span></div><div class="bar"><i style="width:${Math.min(100,p)}%;background:${ov?P.red:p>80?P.yellow:P.aqua}"></i></div></button>`}).join("")}
    ${st.free>0?`<div class="row sp sm" style="padding-top:10px"><span class="mut">Вне бюджета</span><span class="num">${fmt(st.free)} ₸</span></div>`:""}
    <button class="btn ghost w" style="margin-top:12px" data-a="modal" data-v="budget">＋ Добавить статью</button></div>
  <div class="card"><h3>Повторяющиеся платежи</h3><p class="sub">Записываются сами каждый месяц в своё число</p>
    ${D.recurring.length?D.recurring.map(r=>{const c=gc(r.category);return `<button class="tx" data-a="editrec" data-v="${esc(r.id)}"><span class="ico" style="background:${c.color}26">${esc(c.icon)}</span><span class="nm"><b>${esc(c.name)}</b><span>каждое ${r.day}-е число${r.note?", "+esc(r.note):""}</span></span><span class="am num ${r.type==="income"?"inc":"exp"}">${r.type==="income"?"+":"−"}${fmt(r.amount)}</span></button>`}).join(""):`<p class="sm mut">Пока нет. Подойдёт для ипотеки, подписок, связи</p>`}
    <button class="btn ghost w" style="margin-top:12px" data-a="newrec">＋ Добавить платёж</button></div>
  <div class="card"><h3>Плановый доход</h3><p class="sub">Квартальная премия делится на три месяца</p>
    ${[["Зарплата","salary"],["Доп. доход","additional"],["Премия за квартал","bonus"]].map(([l,f])=>`<div class="row sp" style="padding:6px 0"><span class="sm tx2">${l}</span><input class="inp s num" style="width:130px;text-align:right" type="number" inputmode="decimal" value="${D.income[f]||""}" placeholder="0" data-ch="income" data-f="${f}"></div>`).join("")}
    <div class="row sp" style="margin-top:8px;padding-top:10px;border-top:1px solid var(--line)"><span class="sm">Итого в месяц</span><b class="num acc">${fmt(t.mIncome)} ₸</b></div></div>
  <div class="card"><h3>План на месяц</h3><div class="kpis" style="margin:12px 0 0"><div class="kpi"><span>На депозиты</span><b class="num">${fmt(t.sGoal)}</b></div><div class="kpi"><span>Остаток на $</span><b class="num ${t.freeUsd<0?"exp":"warn"}">${t.freeUsd<0?"−":""}${fmt(t.freeUsd)}</b></div><div class="kpi"><span>После бюджета</span><b class="num acc">${t.mIncome-t.tBudget<0?"−":""}${fmt(t.mIncome-t.tBudget)}</b></div></div></div>`;
};
/* ---- Ещё ---- */
V.more=()=>`<div class="card"><h3>Выгрузка данных</h3><p class="sub">Файлы сохраняются на устройство. Таблицу можно открыть в Excel или Google Таблицах</p>
    <div style="display:grid;gap:8px"><button class="btn w" data-a="csv" data-v="month">Таблица за ${moName(ui.ym).toLowerCase()} (CSV)</button><button class="btn w" data-a="csv" data-v="all">Таблица за всё время (CSV)</button><button class="btn w" data-a="png">Графики за ${moName(ui.ym).toLowerCase()} (PNG)</button></div></div>
  <div class="card"><h3>Резервная копия</h3><p class="sub">Все записи, счета и бюджет одним файлом. Пригодится при смене телефона</p>

    <div class="row"><input class="inp s" type="text" placeholder="Например: где я могу сэкономить?" id="aiq"><button class="btn s pri" data-a="ask">Спросить</button></div>

  <div class="card"><h3>Безопасность</h3><button class="btn w" style="margin-top:10px" data-a="changepin">Сменить PIN</button></div>

/* ============ Окна ============ */
const M={};
M.tx=m=>{const cats=m.type==="expense"?expCats():incCats();return `<h2>${m.id?"Изменить запись":"Новая запись"}</h2>
  <div class="seg"><button data-a="txtype" data-v="expense" class="${m.type==="expense"?"on":""}">Расход</button><button data-a="txtype" data-v="income" class="${m.type==="income"?"on":""}">Доход</button></div>
  <div class="fld"><input class="inp num" style="font-size:22px;font-weight:600;text-align:center" type="number" inputmode="decimal" placeholder="Сумма, ₸" data-f="amt" value="${esc(m.amt||"")}"></div>
  <div class="cats">${cats.map(c=>`<button data-a="txcat" data-v="${c.id}" class="${m.cat===c.id?"on":""}"><span>${esc(c.icon)}</span>${esc(c.name)}</button>`).join("")}<button data-a="newcat" style="border-style:dashed;color:var(--acc)"><span>＋</span>Своя</button></div>
  <div class="row fld"><input class="inp" type="text" placeholder="Заметка (необязательно)" data-f="note" value="${esc(m.note||"")}"><input class="inp" style="width:150px;flex:none" type="date" data-f="date" value="${esc(m.date)}"></div>

  <div class="btns">${m.id?`<button class="btn dng" style="flex:none" data-a="deltx">Удалить</button>`:`<button class="btn" data-a="close">Отмена</button>`}<button class="btn pri" data-a="savetx">${m.id?"Сохранить":"Записать"}</button></div>`};
M.cat=m=>`<h2>Своя категория ${m.type==="income"?"дохода":"расхода"}</h2><div class="fld"><label>Значок</label><div class="chips">${EMO.map(i=>`<button data-a="pick" data-f="icon" data-v="${i}" class="${m.icon===i?"on":""}" style="font-size:17px">${i}</button>`).join("")}</div><input class="inp" style="margin-top:8px" data-f="icon" value="${esc(m.icon||"")}" placeholder="или вставьте любой эмодзи" maxlength="8"></div>
  <div class="fld"><label>Название</label><input class="inp" data-f="name" value="${esc(m.name||"")}" maxlength="18" placeholder="Например, Питомец"></div><p class="exp sm" id="err" style="min-height:18px;margin-bottom:6px"></p>

const isMobile=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
async function saveFile(blob,name){
  try{const f=new File([blob],name,{type:blob.type});if(isMobile&&navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}
  catch(e){if(e&&e.name==="AbortError")return}
  const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);
}
function csvBlob(list){
  const q=s=>'"'+String(s??"").replace(/"/g,'""')+'"';
  const rows=[["Дата","Тип","Категория","Сумма","Заметка"],...list.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(t=>[t.date,t.type==="income"?"Доход":"Расход",gc(t.category).name,Math.round(t.amount*100)/100,t.note||""])];
  return new Blob(["﻿"+rows.map(r=>r.map(q).join(";")).join("\r\n")],{type:"text/csv;charset=utf-8"});
}

function svgToPng(svg,W,Hh){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{try{const s=Math.min(2,8000/Hh),c=document.createElement("canvas");c.width=W*s;c.height=Hh*s;c.getContext("2d").drawImage(img,0,0,c.width,c.height);c.toBlob(b=>b?res(b):rej(new Error("png")),"image/png")}catch(e){rej(e)}};img.onerror=()=>rej(new Error("svg"));img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg)})}

  savebud(){syncModal();const m=ui.modal;if(!(m.name||"").trim())return;
    D.budget.forEach(b=>{if(b.id!==m.id){const cur=expCats().filter(c=>budgetOf(c.id)===b).map(c=>c.id);if(cur.some(c=>m.cats.includes(c)))b.cats=cur.filter(c=>!m.cats.includes(c))}});
    let b=D.budget.find(x=>x.id===m.id);if(!b){b={id:uid()};D.budget.push(b)}Object.assign(b,{name:m.name.trim(),icon:m.icon||"🏷️",amount:num(m.amount),cats:m.cats.slice()});ui.modal=null;done()},
  delbud(){const i=D.budget.findIndex(x=>x.id===ui.modal.id);if(i<0)return;const [b]=D.budget.splice(i,1);ui.modal=null;done();toast("Статья удалена","Вернуть",()=>{D.budget.splice(i,0,b);done()})},
  /* анализ и выгрузка */
  analysis(){ui.modal={k:"analysis",a:ui.ym,b:ymShift(ui.ym,-1)};render()},
  copyana(){const m=ui.modal,r=analyze(m.a,m.b),txt=`${moTitle(m.a)} и ${moTitle(m.b)}\n\n`+r.ins.map(i=>i.ic+" "+i.t).join("\n");(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("Текст скопирован"),()=>toast("Не удалось скопировать"))},
  async png(el){const ym=el.dataset.v||ui.ym;toast("Готовлю картинку…");try{const r=reportSVG(ym),b=await svgToPng(r.svg,r.W,r.H);await saveFile(b,`bloknot-${ym}.png`);$("#toast").style.display="none"}catch(e){toast("Не получилось собрать картинку")}},
  csv(el){const all=el.dataset.v==="all",list=all?D.transactions:monthTx(ui.ym);if(!list.length){toast("Нет записей для выгрузки");return}saveFile(csvBlob(list),all?"bloknot-vse-zapisi.csv":`bloknot-${ui.ym}.csv`)},
  backup(){const d=Object.assign({},D,{pin:""});saveFile(new Blob([JSON.stringify({app:"moy-bloknot",version:6,exported:new Date().toISOString(),data:d,history:H},null,1)],{type:"application/json"}),`bloknot-kopiya-${td()}.json`)},
  restore(){$("#file").click()},
  clearlog(){H=[];done()},
  showkey(){ui.showKey=true;render()},
  savekey(){ui.aiKey=$("#aikey").value.trim();LS.set("fv5-key",ui.aiKey);ui.showKey=false;render();toast("Ключ сохранён")},
  async ask(){const q=$("#aiq").value.trim();if(!q)return;if(!ui.aiKey){toast("Сначала сохраните ключ API");return}
    const t=totals(),an=analyze(ui.ym,ymShift(ui.ym,-1));
    const ctx=JSON.stringify({месяц:moTitle(ui.ym),счета:D.banks,долги_мне:D.debts,бюджет:budgetStats(ui.ym).rows.map(r=>({статья:r.b.name,лимит:r.b.amount,потрачено:r.spent})),плановый_доход:D.income,курс_usd:D.usdRate,итоги:t,расходы_по_категориям:an.rows.map(r=>({категория:r.c.name,этот_месяц:r.a,прошлый:r.b})),выводы:an.ins.map(i=>i.t)});
    ui.aiLoading=true;render();
    try{const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":ui.aiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:AI_MODEL,max_tokens:1500,system:"Ты финансовый помощник. Отвечай кратко, по-русски, опираясь только на данные пользователя:\n"+ctx,messages:[{role:"user",content:q}]})});
      const d=await res.json();ui.ai=d.content?d.content.map(c=>c.text||"").join(""):"Ошибка: "+((d.error&&d.error.message)||res.status)}
    catch(e){ui.ai="Не удалось связаться с сервером: "+e.message}
    LS.set("fv5-ai",ui.ai);ui.aiLoading=false;render()}
};
const CH={
  rate(el){const n=num(el.value);if(n>0){D.usdRate=n;done()}},
  income(el){D.income[el.dataset.f]=num(el.value);done()},
  accf(el){const {a}=findAcc(el);if(a){a[el.dataset.f]=num(el.value);done()}},
  ana(el){ui.modal[el.dataset.f]=el.value;render()}
};

/* ============ События ============ */
document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(!el)return;if(el.classList.contains("ov")&&e.target!==el)return;const f=A[el.dataset.a];if(f)f(el,e)});
document.addEventListener("change",e=>{const el=e.target;if(el.id==="file"){const f=el.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const j=JSON.parse(rd.result),d=j.data||j;if(!Array.isArray(d.transactions)||!Array.isArray(d.banks))throw 0;if(!confirm(`В файле ${d.transactions.length} записей. Заменить текущие данные?`))return;const pin=D.pin;D=d;D.pin=pin;if(Array.isArray(j.history))H=j.history;save();load();ui.locked=false;ui.pinSetup=false;render();toast("Данные восстановлены")}catch{toast("Это не файл резервной копии")}};rd.readAsText(f);el.value="";return}
  if(el.dataset&&el.dataset.ch&&CH[el.dataset.ch])CH[el.dataset.ch](el)});
document.addEventListener("input",e=>{if(e.target.dataset&&e.target.dataset.in==="q"){ui.q=e.target.value;$("#txlist").innerHTML=txListHtml()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&ui.modal){ui.modal=null;render()}if(e.key==="Enter"&&e.target.id==="aiq")A.ask()});
const tipEl=$("#tip");
function hideTip(){tipEl.style.display="none"}
function showTip(e){const t=e.target.closest&&e.target.closest("[data-tip]");if(!t){hideTip();return}tipEl.textContent=t.dataset.tip;tipEl.style.display="block";const r=tipEl.getBoundingClientRect();let x=e.clientX-r.width/2,y=e.clientY-r.height-14;x=Math.max(8,Math.min(x,innerWidth-r.width-8));if(y<8)y=e.clientY+18;tipEl.style.left=x+"px";tipEl.style.top=y+"px"}
document.addEventListener("pointermove",showTip);document.addEventListener("pointerdown",showTip);window.addEventListener("scroll",hideTip,{passive:true});

load();render();
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
