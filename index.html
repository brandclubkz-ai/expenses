<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#06061a">
<title>Мой Блокнот</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body,#root{height:100%;background:#06061a;color:#e2e0f0;font-family:'DM Sans',sans-serif}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

// --- Storage helper (localStorage) ---
const LS = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

const INITIAL_DATA = {
  banks: [
    { id: "kaspi", name: "Kaspi Bank", icon: "🔴", accounts: [
      { id: "kaspi_main", name: "Основной счёт", balance: 0 },
    ]},
    { id: "otbasy", name: "Отбасы Банк", icon: "🏠", accounts: [
      { id: "otb1", name: "Депозит #1 (02.12.2025)", balance: 105020, monthlyGoal: 75000 },
      { id: "otb2", name: "Депозит #2 (13.09.2024)", balance: 845775, monthlyGoal: 75000 },
      { id: "otb3", name: "Депозит #3 (20.04.2026)", balance: 20000, monthlyGoal: 75000 },
    ]},
    { id: "forte", name: "Forte Bank", icon: "🟢", accounts: [
      { id: "forte_usd", name: "Доллары", balance: 1055, currency: "$", avgPrice: 467 },
    ]},
  ],
  debts: [
    { id: "d1", name: "Брат", amount: 1251000 },
    { id: "d2", name: "Сестра", amount: 900000 },
    { id: "d3", name: "Друг", amount: 1415000 },
    { id: "d4", name: "Должник", amount: 1000000 },
  ],
  expenses: [
    { id: "e1", name: "Ипотека", amount: 225000, icon: "🏠" },
    { id: "e2", name: "Еда и кафе", amount: 250000, icon: "🍔" },
    { id: "e3", name: "Бухгалтер", amount: 20000, icon: "📋" },
    { id: "e4", name: "Другое", amount: 50000, icon: "🏷️" },
    { id: "e5", name: "Коммуналка и интернет", amount: 30000, icon: "💡" },
    { id: "e6", name: "Подписки и связь", amount: 20000, icon: "📱" },
  ],
  income: { salary: 703000, bonus: 527000, additional: 150000 },
  usdRate: 467,
};

function fmt(n) { return new Intl.NumberFormat("ru-RU").format(Math.round(Math.abs(n))); }

function InlineAmountInput({ onSubmit, placeholder, btnLabel, btnColor, compact }) {
  const [val, setVal] = useState("");
  const submit = () => { const n = parseFloat(val); if (!n) return; onSubmit(n); setVal(""); };
  return (
    <div style={{ display: "flex", gap: 6, marginTop: compact ? 6 : 10 }}>
      <input type="number" value={val} onChange={e => setVal(e.target.value)} onKeyDown={e => e.key === "Enter" && submit()}
        placeholder={placeholder || "Сумма"}
        style={{ flex: 1, padding: "8px 12px", borderRadius: 10, border: "1px solid #2a2745", background: "#0c0a1a", color: "#fff", fontSize: 14, fontFamily: "'DM Sans',sans-serif", minWidth: 0 }} />
      <button onClick={submit} style={{ padding: "8px 14px", borderRadius: 10, border: "none", background: btnColor || "#6366f1", color: "#fff", fontSize: 13, fontWeight: 600, cursor: "pointer", fontFamily: "'DM Sans',sans-serif", whiteSpace: "nowrap" }}>
        {btnLabel || "+"}
      </button>
    </div>
  );
}

function UsdBuyInput({ onBuy, onSell, currentRate }) {
  const [amount, setAmount] = useState("");
  const [rate, setRate] = useState(currentRate ? String(currentRate) : "");
  const totalTg = (parseFloat(amount) || 0) * (parseFloat(rate) || 0);
  return (
    <div style={{ marginTop: 12 }}>
      <div style={{ display: "flex", gap: 6 }}>
        <input type="number" value={amount} onChange={e => setAmount(e.target.value)} placeholder="Сумма $"
          style={{ flex: 1, padding: "8px 12px", borderRadius: 10, border: "1px solid #2a2745", background: "#0c0a1a", color: "#fff", fontSize: 14, fontFamily: "'DM Sans',sans-serif", minWidth: 0 }} />
        <input type="number" value={rate} onChange={e => setRate(e.target.value)} placeholder="Курс ₸/$"
          style={{ width: 90, padding: "8px 10px", borderRadius: 10, border: "1px solid #2a2745", background: "#0c0a1a", color: "#fbbf24", fontSize: 14, fontFamily: "'DM Sans',sans-serif", textAlign: "center" }} />
      </div>
      {totalTg > 0 && <div style={{ fontSize: 11, color: "#a08a3a", marginTop: 4, textAlign: "right" }}>= {fmt(totalTg)} ₸</div>}
      <div style={{ display: "flex", gap: 6, marginTop: 6 }}>
        <button onClick={() => { const a = parseFloat(amount), r = parseFloat(rate); if (!a || !r) return; onBuy(a, r); setAmount(""); setRate(currentRate ? String(currentRate) : ""); }}
          style={{ flex: 1, padding: "9px 12px", borderRadius: 10, border: "none", background: "#22804a", color: "#fff", fontSize: 13, fontWeight: 600, cursor: "pointer", fontFamily: "'DM Sans',sans-serif" }}>Купил $</button>
        <button onClick={() => { const a = parseFloat(amount); if (!a) return; onSell(a); setAmount(""); setRate(currentRate ? String(currentRate) : ""); }}
          style={{ flex: 1, padding: "9px 12px", borderRadius: 10, border: "none", background: "#9f3040", color: "#fff", fontSize: 13, fontWeight: 600, cursor: "pointer", fontFamily: "'DM Sans',sans-serif" }}>Продал $</button>
      </div>
    </div>
  );
}

function App() {
  const [data, setData] = useState(null);
  const [loaded, setLoaded] = useState(false);
  const [tab, setTab] = useState("overview");
  const [history, setHistory] = useState([]);
  const [aiResult, setAiResult] = useState("");
  const [aiLoading, setAiLoading] = useState(false);
  const [aiQuestion, setAiQuestion] = useState("");
  const [aiKey, setAiKey] = useState("");
  const [showKeyInput, setShowKeyInput] = useState(false);
  const [modal, setModal] = useState(null);
  const [modalFields, setModalFields] = useState({});

  useEffect(() => {
    const d = LS.get("fv3-data"); setData(d || INITIAL_DATA);
    const h = LS.get("fv3-history"); if (h) setHistory(h);
    const ai = LS.get("fv3-ai"); if (ai) setAiResult(ai);
    const k = LS.get("fv3-aikey"); if (k) setAiKey(k);
    setLoaded(true);
  }, []);

  const save = useCallback((d, h) => {
    LS.set("fv3-data", d);
    if (h) LS.set("fv3-history", h);
  }, []);

  const log = (text) => {
    const nh = [{ date: new Date().toISOString().slice(0, 10), time: new Date().toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" }), text }, ...history].slice(0, 80);
    setHistory(nh); return nh;
  };

  const updateAccount = (bankId, accId, delta, note) => {
    const nd = { ...data, banks: data.banks.map(b => b.id === bankId ? { ...b, accounts: b.accounts.map(a => a.id === accId ? { ...a, balance: a.balance + delta } : a) } : b) };
    setData(nd);
    const bank = data.banks.find(b => b.id === bankId); const acc = bank.accounts.find(a => a.id === accId);
    const nh = log(`${bank.icon} ${acc.name}: ${delta > 0 ? "+" : ""}${fmt(delta)} ${acc.currency || "₸"}${note ? " — " + note : ""}`);
    save(nd, nh);
  };

  const setAccountBalance = (bankId, accId, newBal) => {
    const nd = { ...data, banks: data.banks.map(b => b.id === bankId ? { ...b, accounts: b.accounts.map(a => a.id === accId ? { ...a, balance: newBal } : a) } : b) };
    setData(nd);
    const bank = data.banks.find(b => b.id === bankId); const acc = bank.accounts.find(a => a.id === accId);
    const nh = log(`${bank.icon} ${acc.name}: баланс → ${fmt(newBal)} ${acc.currency || "₸"}`);
    save(nd, nh);
  };

  const buyUsd = (bankId, accId, usdAmount, rate) => {
    const nd = { ...data, banks: data.banks.map(b => b.id === bankId ? { ...b, accounts: b.accounts.map(a => {
      if (a.id !== accId) return a;
      const oldTotal = a.balance * (a.avgPrice || 0), newBalance = a.balance + usdAmount;
      const newAvg = newBalance > 0 ? (oldTotal + usdAmount * rate) / newBalance : rate;
      return { ...a, balance: newBalance, avgPrice: Math.round(newAvg * 100) / 100 };
    }) } : b) };
    setData(nd);
    const bank = data.banks.find(b => b.id === bankId); const acc = bank.accounts.find(a => a.id === accId);
    const newBal = acc.balance + usdAmount, oldT = acc.balance * (acc.avgPrice || 0);
    const newAvg = newBal > 0 ? Math.round((oldT + usdAmount * rate) / newBal * 100) / 100 : rate;
    const nh = log(`${bank.icon} Купил $${fmt(usdAmount)} по ${fmt(rate)} ₸/$ (${fmt(usdAmount * rate)} ₸) — сред: ${fmt(newAvg)} ₸/$`);
    save(nd, nh);
  };

  const sellUsd = (bankId, accId, usdAmount) => {
    const nd = { ...data, banks: data.banks.map(b => b.id === bankId ? { ...b, accounts: b.accounts.map(a => a.id !== accId ? a : { ...a, balance: Math.max(0, a.balance - usdAmount) }) } : b) };
    setData(nd);
    const bank = data.banks.find(b => b.id === bankId);
    const nh = log(`${bank.icon} Продал $${fmt(usdAmount)}`); save(nd, nh);
  };

  const updateDebt = (id, delta) => {
    const nd = { ...data, debts: data.debts.map(d => d.id === id ? { ...d, amount: Math.max(0, d.amount - delta) } : d) };
    setData(nd); const debt = data.debts.find(d => d.id === id);
    const nh = log(`💸 ${debt.name} вернул(а) ${fmt(delta)} ₸ (осталось: ${fmt(Math.max(0, debt.amount - delta))} ₸)`); save(nd, nh);
  };

  const deleteDebt = (id) => {
    const debt = data.debts.find(d => d.id === id);
    const nd = { ...data, debts: data.debts.filter(d => d.id !== id) };
    setData(nd); const nh = log(`✅ ${debt.name}: долг закрыт`); save(nd, nh);
  };

  const addDebt = () => {
    if (!modalFields.name || !modalFields.amount) return;
    const nd = { ...data, debts: [...data.debts, { id: Date.now().toString(), name: modalFields.name, amount: parseFloat(modalFields.amount) }] };
    setData(nd); const nh = log(`📌 Новый долг: ${modalFields.name} — ${fmt(parseFloat(modalFields.amount))} ₸`);
    save(nd, nh); setModal(null); setModalFields({});
  };

  const addAccount = () => {
    if (!modalFields.bankId || !modalFields.name) return;
    const nd = { ...data, banks: data.banks.map(b => b.id === modalFields.bankId ? { ...b, accounts: [...b.accounts, { id: Date.now().toString(), name: modalFields.name, balance: parseFloat(modalFields.balance) || 0, currency: modalFields.currency || "₸", monthlyGoal: parseFloat(modalFields.goal) || 0 }] } : b) };
    setData(nd); save(nd); setModal(null); setModalFields({});
  };

  const addExpense = () => {
    if (!modalFields.name || !modalFields.amount) return;
    const nd = { ...data, expenses: [...data.expenses, { id: Date.now().toString(), name: modalFields.name, amount: parseFloat(modalFields.amount), icon: modalFields.icon || "🏷️" }] };
    setData(nd); save(nd); setModal(null); setModalFields({});
  };

  const deleteExpense = (id) => { const nd = { ...data, expenses: data.expenses.filter(e => e.id !== id) }; setData(nd); save(nd); };
  const updateExpense = (id, v) => { const nd = { ...data, expenses: data.expenses.map(e => e.id === id ? { ...e, amount: v } : e) }; setData(nd); save(nd); };
  const updateIncome = (f, v) => { const nd = { ...data, income: { ...data.income, [f]: v } }; setData(nd); save(nd); };
  const updateRate = (r) => { const nd = { ...data, usdRate: r }; setData(nd); save(nd); };

  const allAccounts = data ? data.banks.flatMap(b => b.accounts.map(a => ({ ...a, bankId: b.id, bankName: b.name, bankIcon: b.icon }))) : [];
  const totalTg = allAccounts.filter(a => (a.currency || "₸") === "₸").reduce((s, a) => s + a.balance, 0);
  const totalUsd = allAccounts.filter(a => a.currency === "$").reduce((s, a) => s + a.balance, 0);
  const totalInvestTg = totalUsd * (data?.usdRate || 467);
  const totalDebts = data ? data.debts.reduce((s, d) => s + d.amount, 0) : 0;
  const totalExp = data ? data.expenses.reduce((s, e) => s + e.amount, 0) : 0;
  const monthlyIncome = data ? data.income.salary + data.income.additional + Math.round(data.income.bonus / 3) : 0;
  const monthlySavingsGoal = allAccounts.filter(a => a.monthlyGoal).reduce((s, a) => s + a.monthlyGoal, 0);
  const freeForUsd = monthlyIncome - totalExp - monthlySavingsGoal;
  const netWorth = totalTg + totalInvestTg + totalDebts;

  const runAI = async (question) => {
    if (!aiKey) { setShowKeyInput(true); return; }
    setAiLoading(true); setAiResult("");
    const ctx = JSON.stringify({ banks: data.banks.map(b => ({ name: b.name, accounts: b.accounts.map(a => ({ name: a.name, balance: a.balance, currency: a.currency || "₸", monthlyGoal: a.monthlyGoal || 0, avgPrice: a.avgPrice || null })) })), debts: data.debts, expenses: data.expenses, income: data.income, usdRate: data.usdRate, computed: { totalTg, totalUsd, totalInvestTg, totalDebts, totalExp, monthlyIncome, monthlySavingsGoal, freeForUsd, netWorth } });
    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST", headers: { "Content-Type": "application/json", "x-api-key": aiKey, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
        body: JSON.stringify({ model: "claude-sonnet-4-20250514", max_tokens: 1000,
          system: "Ты — финансовый AI-аналитик. Отвечай кратко, по делу, на русском. Используй цифры из данных. Давай конкретные советы. Форматируй красиво с эмодзи. Данные:\n" + ctx,
          messages: [{ role: "user", content: question || "Дай полный анализ моего финансового состояния, советы по оптимизации, и оценку рисков." }],
        }),
      });
      const d = await res.json();
      if (d.error) { setAiResult("Ошибка API: " + (d.error.message || JSON.stringify(d.error))); }
      else { const text = d.content?.map(c => c.text || "").join("") || "Нет ответа"; setAiResult(text); LS.set("fv3-ai", text); }
    } catch (e) { setAiResult("Ошибка: " + e.message); }
    setAiLoading(false);
  };

  if (!loaded || !data) return <div style={{ display: "flex", alignItems: "center", justifyContent: "center", height: "100vh", background: "#06061a", color: "#6366f1" }}>Загрузка...</div>;

  const TABS = [
    { id: "overview", label: "Обзор", icon: "◉" },
    { id: "banks", label: "Банки", icon: "🏦" },
    { id: "budget", label: "Бюджет", icon: "📊" },
    { id: "debts", label: "Долги", icon: "💸" },
    { id: "ai", label: "AI", icon: "🧠" },
    { id: "log", label: "Лог", icon: "📝" },
  ];

  const Card = ({ children, bg }) => <div style={{ background: bg || "#0d0c22", borderRadius: 18, padding: "18px 16px", marginBottom: 12, border: "1px solid #1c1a35" }}>{children}</div>;
  const Lbl = ({ children }) => <div style={{ fontSize: 11, color: "#7a7a8a", fontWeight: 500, textTransform: "uppercase", letterSpacing: "0.5px" }}>{children}</div>;
  const Big = ({ children, color }) => <div style={{ fontSize: 22, fontWeight: 700, color: color || "#fff", marginTop: 4 }}>{children}</div>;

  return (
    <div style={S.root}>
      <div style={S.header}>
        <div><h1 style={S.title}>Мой Блокнот</h1><p style={S.sub}>Финансовый дневник</p></div>
        <div style={S.badge}>
          <div style={{ fontSize: 9, color: "#6a6a7a", fontWeight: 600, textTransform: "uppercase", letterSpacing: 1 }}>Капитал</div>
          <div style={{ fontSize: 16, fontWeight: 700, color: "#a5b4fc" }}>{fmt(netWorth)} ₸</div>
        </div>
      </div>

      <div style={S.nav}>
        {TABS.map(t => <button key={t.id} onClick={() => setTab(t.id)} style={{ ...S.navBtn, ...(tab === t.id ? S.navAct : {}) }}>
          <span style={{ fontSize: 15 }}>{t.icon}</span><span style={{ fontSize: 10 }}>{t.label}</span>
        </button>)}
      </div>

      <div style={S.body}>
        {/* OVERVIEW */}
        {tab === "overview" && <>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 2 }}>
            <Card bg="linear-gradient(135deg,#071f17,#0d3525)"><Lbl>Доход / мес</Lbl><Big color="#6ee7b7">{fmt(monthlyIncome)} ₸</Big><div style={{ fontSize: 10, color: "#4ade80", marginTop: 3 }}>ЗП + доп + премия/3</div></Card>
            <Card bg="linear-gradient(135deg,#1f0a17,#351525)"><Lbl>Расходы / мес</Lbl><Big color="#fca5a5">{fmt(totalExp)} ₸</Big><div style={{ fontSize: 10, color: "#f87171", marginTop: 3 }}>{Math.round(totalExp / monthlyIncome * 100)}% дохода</div></Card>
          </div>
          <Card bg="linear-gradient(135deg,#0c0b30,#161458)">
            <Lbl>Ежемесячный план</Lbl>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 10, marginTop: 10 }}>
              <div><div style={{ fontSize: 10, color: "#818cf8" }}>Депозиты</div><div style={{ fontSize: 15, fontWeight: 700, color: "#c7d2fe" }}>{fmt(monthlySavingsGoal)} ₸</div></div>
              <div><div style={{ fontSize: 10, color: "#818cf8" }}>Остаток→$</div><div style={{ fontSize: 15, fontWeight: 700, color: freeForUsd >= 0 ? "#fbbf24" : "#f87171" }}>{fmt(freeForUsd)} ₸</div><div style={{ fontSize: 10, color: "#a08a3a" }}>≈ ${fmt(freeForUsd / data.usdRate)}</div></div>
              <div><div style={{ fontSize: 10, color: "#818cf8" }}>Свободно</div><div style={{ fontSize: 15, fontWeight: 700, color: "#a5b4fc" }}>{fmt(monthlyIncome - totalExp)} ₸</div></div>
            </div>
          </Card>
          <Card>
            <Lbl>Структура капитала</Lbl>
            <div style={{ marginTop: 10 }}>
              {[{ label: "Тенге на счетах", val: totalTg, color: "#6366f1" },{ label: `Доллары ($${fmt(totalUsd)})`, val: totalInvestTg, color: "#f59e0b" },{ label: "Долги (мне должны)", val: totalDebts, color: "#34d399" }].map((it, i) =>
                <div key={i} style={{ marginBottom: 10 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, marginBottom: 3 }}><span style={{ color: "#9a9aaa" }}>{it.label}</span><span style={{ color: "#e0e0f0", fontWeight: 600 }}>{fmt(it.val)} ₸</span></div>
                  <div style={{ height: 6, borderRadius: 3, background: "#1a1730" }}><div style={{ height: "100%", borderRadius: 3, background: it.color, width: `${netWorth ? Math.min(it.val / netWorth * 100, 100) : 0}%`, transition: "width 0.5s" }} /></div>
                </div>
              )}
            </div>
          </Card>
          <Card>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <Lbl>Курс USD / ₸</Lbl>
              <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
                <input type="number" value={data.usdRate} onChange={e => updateRate(parseFloat(e.target.value) || 0)} style={{ width: 70, padding: "5px 8px", borderRadius: 8, border: "1px solid #2a2745", background: "#0c0a1a", color: "#fff", fontSize: 14, fontFamily: "'DM Sans',sans-serif", textAlign: "center" }} />
                <span style={{ color: "#6a6a7a", fontSize: 12 }}>₸/$</span>
              </div>
            </div>
          </Card>
        </>}

        {/* BANKS */}
        {tab === "banks" && <>
          {data.banks.map(bank => <div key={bank.id}>
            <h3 style={{ fontSize: 15, fontWeight: 600, color: "#c0c0d8", margin: "16px 0 10px" }}>{bank.icon} {bank.name}</h3>
            {bank.accounts.map(acc => {
              const cur = acc.currency || "₸", isUsd = cur === "$";
              return <Card key={acc.id} bg={isUsd ? "linear-gradient(135deg,#1a1500,#252000)" : undefined}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                  <div>
                    <div style={{ fontWeight: 600, color: "#e0e0f0", fontSize: 14 }}>{acc.name}</div>
                    {acc.monthlyGoal > 0 && <div style={{ fontSize: 11, color: "#818cf8", marginTop: 2 }}>Цель: +{fmt(acc.monthlyGoal)} ₸/мес</div>}
                    {isUsd && acc.avgPrice > 0 && <div style={{ fontSize: 11, color: "#a08a3a", marginTop: 2 }}>Средняя покупка: <span style={{ fontWeight: 700, color: "#fbbf24" }}>{fmt(acc.avgPrice)} ₸/$</span></div>}
                    {isUsd && acc.avgPrice > 0 && data.usdRate > 0 && <div style={{ fontSize: 11, color: data.usdRate >= acc.avgPrice ? "#34d399" : "#f87171", marginTop: 1 }}>{data.usdRate >= acc.avgPrice ? "📈" : "📉"} Курс: {fmt(data.usdRate)} ₸/$ ({data.usdRate >= acc.avgPrice ? "+" : ""}{((data.usdRate - acc.avgPrice) / acc.avgPrice * 100).toFixed(1)}%)</div>}
                  </div>
                  <div style={{ textAlign: "right" }}>
                    <div style={{ fontSize: 22, fontWeight: 700, color: isUsd ? "#fde68a" : "#a5b4fc" }}>{isUsd ? "$" : ""}{fmt(acc.balance)}{!isUsd ? " ₸" : ""}</div>
                    {isUsd && <div style={{ fontSize: 12, color: "#a08a3a" }}>≈ {fmt(acc.balance * data.usdRate)} ₸</div>}
                    {isUsd && acc.avgPrice > 0 && <div style={{ fontSize: 10, color: "#6a6a7a" }}>вложено: {fmt(acc.balance * acc.avgPrice)} ₸</div>}
                  </div>
                </div>
                {isUsd ? <UsdBuyInput currentRate={data.usdRate} onBuy={(a, r) => buyUsd(bank.id, acc.id, a, r)} onSell={(a) => sellUsd(bank.id, acc.id, a)} /> : (
                  <div style={{ marginTop: 12, display: "flex", flexDirection: "column", gap: 6 }}>
                    <div style={{ display: "flex", gap: 6 }}>
                      <input type="number" placeholder="Сумма ₸" id={`inp-${acc.id}`} style={{ flex: 1, padding: "9px 12px", borderRadius: 10, border: "1px solid #2a2745", background: "#0c0a1a", color: "#fff", fontSize: 14, fontFamily: "'DM Sans',sans-serif", minWidth: 0 }} />
                      <button onClick={() => { const inp = document.getElementById(`inp-${acc.id}`); const n = parseFloat(inp?.value); if (!n) return; updateAccount(bank.id, acc.id, n, "пополнение"); inp.value = ""; }}
                        style={{ padding: "9px 16px", borderRadius: 10, border: "none", background: "#22804a", color: "#fff", fontSize: 13, fontWeight: 600, cursor: "pointer", fontFamily: "'DM Sans',sans-serif", whiteSpace: "nowrap" }}>Внести</button>
                      <button onClick={() => { const inp = document.getElementById(`inp-${acc.id}`); const n = parseFloat(inp?.value); if (!n) return; updateAccount(bank.id, acc.id, -n, "снятие"); inp.value = ""; }}
                        style={{ padding: "9px 16px", borderRadius: 10, border: "none", background: "#9f3040", color: "#fff", fontSize: 13, fontWeight: 600, cursor: "pointer", fontFamily: "'DM Sans',sans-serif", whiteSpace: "nowrap" }}>Снять</button>
                    </div>
                    <InlineAmountInput placeholder="Установить баланс" btnLabel="= Set" btnColor="#4338ca" onSubmit={(n) => setAccountBalance(bank.id, acc.id, n)} compact />
                  </div>
                )}
              </Card>;
            })}
          </div>)}
          <button style={S.addBtn} onClick={() => { setModal("account"); setModalFields({ bankId: data.banks[0]?.id }); }}>+ Добавить счёт</button>
        </>}

        {/* BUDGET */}
        {tab === "budget" && <>
          <h3 style={S.secTitle}>💰 Доходы</h3>
          <Card>
            {[{ label: "Зарплата", field: "salary", val: data.income.salary },{ label: "Доп. доход", field: "additional", val: data.income.additional },{ label: "Премия (раз/квартал)", field: "bonus", val: data.income.bonus }].map((it, i) =>
              <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 0", borderBottom: i < 2 ? "1px solid #1c1a35" : "none" }}>
                <span style={{ color: "#b0b0c0", fontSize: 13 }}>{it.label}</span>
                <input type="number" value={it.val} onChange={e => updateIncome(it.field, parseFloat(e.target.value) || 0)} style={{ width: 110, padding: "6px 10px", borderRadius: 8, border: "1px solid #2a2745", background: "#0c0a1a", color: "#a5b4fc", fontSize: 14, fontFamily: "'DM Sans',sans-serif", textAlign: "right", fontWeight: 600 }} />
              </div>
            )}
            <div style={{ borderTop: "1px solid #312e81", marginTop: 6, paddingTop: 10, display: "flex", justifyContent: "space-between" }}>
              <span style={{ color: "#818cf8", fontWeight: 600, fontSize: 13 }}>Итого / мес (ЗП + доп + премия÷3)</span>
              <span style={{ color: "#a5b4fc", fontWeight: 700, fontSize: 16 }}>{fmt(monthlyIncome)} ₸</span>
            </div>
          </Card>
          <h3 style={S.secTitle}>📊 Расходы — {fmt(totalExp)} ₸/мес</h3>
          {data.expenses.map(e => {
            const maxE = Math.max(...data.expenses.map(x => x.amount), 1);
            return <div key={e.id} style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
              <span style={{ fontSize: 18, width: 28, textAlign: "center" }}>{e.icon}</span>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 3 }}>
                  <span style={{ color: "#c0c0d8", fontSize: 13 }}>{e.name}</span>
                  <input type="number" value={e.amount} onChange={ev => updateExpense(e.id, parseFloat(ev.target.value) || 0)} style={{ width: 90, padding: "4px 8px", borderRadius: 7, border: "1px solid #2a2745", background: "#0c0a1a", color: "#f0a0a0", fontSize: 13, fontFamily: "'DM Sans',sans-serif", textAlign: "right", fontWeight: 600 }} />
                </div>
                <div style={{ height: 4, borderRadius: 2, background: "#1a1730" }}><div style={{ height: "100%", borderRadius: 2, width: `${(e.amount / maxE) * 100}%`, background: "linear-gradient(90deg,#f87171,#fb923c)", transition: "width 0.4s" }} /></div>
              </div>
              <button onClick={() => deleteExpense(e.id)} style={{ background: "none", border: "none", color: "#4a4a5a", cursor: "pointer", fontSize: 14 }}>✕</button>
            </div>;
          })}
          <button style={S.addBtn} onClick={() => { setModal("expense"); setModalFields({ icon: "🏷️" }); }}>+ Добавить расход</button>
        </>}

        {/* DEBTS */}
        {tab === "debts" && <>
          <Card bg="linear-gradient(135deg,#071f17,#0d3525)"><Lbl>Итого мне должны</Lbl><Big color="#34d399">{fmt(totalDebts)} ₸</Big></Card>
          {data.debts.map(d => <Card key={d.id}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <div style={{ fontWeight: 600, color: "#e0e0f0", fontSize: 15 }}>{d.name}</div>
              <div style={{ fontSize: 20, fontWeight: 700, color: d.amount > 0 ? "#34d399" : "#6a6a7a" }}>{fmt(d.amount)} ₸</div>
            </div>
            <InlineAmountInput placeholder="Сколько вернул(а)?" btnLabel="Вернул" btnColor="#22804a" onSubmit={(n) => updateDebt(d.id, n)} />
            <button onClick={() => deleteDebt(d.id)} style={{ marginTop: 8, background: "none", border: "1px solid #2a2745", borderRadius: 8, color: "#6a6a7a", padding: "6px 12px", fontSize: 11, cursor: "pointer", fontFamily: "'DM Sans',sans-serif" }}>Долг закрыт полностью ✓</button>
          </Card>)}
          <button style={S.addBtn} onClick={() => { setModal("debt"); setModalFields({}); }}>+ Добавить должника</button>
        </>}

        {/* AI */}
        {tab === "ai" && <>
          <Card bg="linear-gradient(135deg,#0f0a30,#1a1260)">
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12 }}>
              <span style={{ fontSize: 24 }}>🧠</span>
              <div><div style={{ fontWeight: 700, color: "#c7d2fe", fontSize: 16 }}>AI Аналитик</div><div style={{ fontSize: 11, color: "#818cf8" }}>Персональный финансовый советник</div></div>
            </div>
            {showKeyInput || !aiKey ? (
              <div style={{ marginBottom: 10 }}>
                <div style={{ fontSize: 12, color: "#818cf8", marginBottom: 6 }}>Введите Anthropic API ключ (хранится только на вашем устройстве):</div>
                <div style={{ display: "flex", gap: 6 }}>
                  <input type="password" value={aiKey} onChange={e => setAiKey(e.target.value)} placeholder="sk-ant-..." style={{ flex: 1, padding: "10px 14px", borderRadius: 12, border: "1px solid #312e81", background: "#0c0a2a", color: "#fff", fontSize: 13, fontFamily: "'DM Sans',sans-serif" }} />
                  <button onClick={() => { LS.set("fv3-aikey", aiKey); setShowKeyInput(false); }} style={{ padding: "10px 16px", borderRadius: 12, border: "none", background: "linear-gradient(135deg,#6366f1,#8b5cf6)", color: "#fff", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>✓</button>
                </div>
              </div>
            ) : (
              <div style={{ fontSize: 11, color: "#4a4a5a", marginBottom: 8, cursor: "pointer" }} onClick={() => setShowKeyInput(true)}>🔑 API ключ сохранён (нажмите чтобы изменить)</div>
            )}
            <div style={{ display: "flex", gap: 6 }}>
              <input type="text" value={aiQuestion} onChange={e => setAiQuestion(e.target.value)} onKeyDown={e => e.key === "Enter" && aiQuestion && runAI(aiQuestion)}
                placeholder="Задай вопрос о финансах..." disabled={aiLoading} style={{ flex: 1, padding: "10px 14px", borderRadius: 12, border: "1px solid #312e81", background: "#0c0a2a", color: "#fff", fontSize: 13, fontFamily: "'DM Sans',sans-serif" }} />
              <button onClick={() => aiQuestion && runAI(aiQuestion)} disabled={aiLoading || !aiQuestion}
                style={{ padding: "10px 18px", borderRadius: 12, border: "none", background: aiLoading ? "#2a2745" : "linear-gradient(135deg,#6366f1,#8b5cf6)", color: "#fff", fontSize: 14, cursor: aiLoading ? "wait" : "pointer", fontWeight: 600 }}>{aiLoading ? "..." : "→"}</button>
            </div>
          </Card>
          {aiLoading && <Card><div style={{ display: "flex", alignItems: "center", gap: 10 }}><div style={{ width: 20, height: 20, border: "2px solid #6366f1", borderTopColor: "transparent", borderRadius: "50%", animation: "spin 0.8s linear infinite" }} /><span style={{ color: "#818cf8", fontSize: 13 }}>Анализирую...</span></div></Card>}
          {aiResult && !aiLoading && <Card><div style={{ fontSize: 13, color: "#d0d0e8", lineHeight: 1.7, whiteSpace: "pre-wrap" }}>{aiResult}</div></Card>}
        </>}

        {/* LOG */}
        {tab === "log" && <>
          <h3 style={S.secTitle}>История изменений</h3>
          {history.length === 0 && <div style={{ textAlign: "center", padding: 40, color: "#4a4a5a" }}><p style={{ fontSize: 32 }}>📋</p><p>Пока пусто</p></div>}
          {history.map((h, i) => <div key={i} style={{ padding: "8px 0", borderBottom: "1px solid #141230", display: "flex", justifyContent: "space-between", gap: 10 }}>
            <span style={{ color: "#b0b0c0", fontSize: 12, lineHeight: 1.5 }}>{h.text}</span>
            <span style={{ color: "#4a4a5a", fontSize: 10, flexShrink: 0, whiteSpace: "nowrap" }}>{h.date} {h.time}</span>
          </div>)}
          {history.length > 0 && <button style={{ ...S.addBtn, marginTop: 16, color: "#f87171", borderColor: "#3b1525" }} onClick={() => { setHistory([]); LS.set("fv3-history", []); }}>Очистить лог</button>}
        </>}
      </div>

      {/* MODALS */}
      {modal && <div style={S.overlay} onClick={() => setModal(null)}>
        <div style={S.modal} onClick={e => e.stopPropagation()}>
          {modal === "debt" && <>
            <h2 style={S.modalTitle}>Новый должник</h2>
            <input type="text" placeholder="Имя" value={modalFields.name || ""} onChange={e => setModalFields({ ...modalFields, name: e.target.value })} style={S.inp} />
            <input type="number" placeholder="Сумма ₸" value={modalFields.amount || ""} onChange={e => setModalFields({ ...modalFields, amount: e.target.value })} style={S.inp} />
            <div style={S.modalRow}><button style={S.cancelBtn} onClick={() => setModal(null)}>Отмена</button><button style={S.saveBtn} onClick={addDebt}>Добавить</button></div>
          </>}
          {modal === "account" && <>
            <h2 style={S.modalTitle}>Новый счёт</h2>
            <div style={{ display: "flex", gap: 6, marginBottom: 10 }}>
              {data.banks.map(b => <button key={b.id} onClick={() => setModalFields({ ...modalFields, bankId: b.id })} style={{ flex: 1, padding: "10px 4px", borderRadius: 10, border: modalFields.bankId === b.id ? "2px solid #6366f1" : "1px solid #1c1a35", background: modalFields.bankId === b.id ? "#1e1b4b" : "#0c0a1a", color: "#c0c0d8", fontSize: 12, cursor: "pointer", textAlign: "center", fontFamily: "'DM Sans',sans-serif" }}>{b.icon} {b.name}</button>)}
            </div>
            <input type="text" placeholder="Название счёта" value={modalFields.name || ""} onChange={e => setModalFields({ ...modalFields, name: e.target.value })} style={S.inp} />
            <div style={{ display: "flex", gap: 8 }}>
              <input type="number" placeholder="Баланс" value={modalFields.balance || ""} onChange={e => setModalFields({ ...modalFields, balance: e.target.value })} style={{ ...S.inp, flex: 1 }} />
              <select value={modalFields.currency || "₸"} onChange={e => setModalFields({ ...modalFields, currency: e.target.value })} style={{ ...S.inp, width: 70 }}><option value="₸">₸</option><option value="$">$</option><option value="€">€</option></select>
            </div>
            <input type="number" placeholder="Цель пополнения/мес (необяз.)" value={modalFields.goal || ""} onChange={e => setModalFields({ ...modalFields, goal: e.target.value })} style={S.inp} />
            <div style={S.modalRow}><button style={S.cancelBtn} onClick={() => setModal(null)}>Отмена</button><button style={S.saveBtn} onClick={addAccount}>Добавить</button></div>
          </>}
          {modal === "expense" && <>
            <h2 style={S.modalTitle}>Новый расход</h2>
            <div style={{ display: "flex", gap: 5, marginBottom: 10, flexWrap: "wrap" }}>
              {["🏠","🍔","🚗","💊","👕","🎮","📚","📱","💡","📋","✈️","🏷️","🐾","💇","🎁","🏋️"].map(ic => <button key={ic} onClick={() => setModalFields({ ...modalFields, icon: ic })} style={{ fontSize: 18, padding: "5px 7px", borderRadius: 8, border: modalFields.icon === ic ? "2px solid #6366f1" : "1px solid #1c1a35", background: modalFields.icon === ic ? "#1e1b4b" : "#0c0a1a", cursor: "pointer" }}>{ic}</button>)}
            </div>
            <input type="text" placeholder="Название" value={modalFields.name || ""} onChange={e => setModalFields({ ...modalFields, name: e.target.value })} style={S.inp} />
            <input type="number" placeholder="Сумма / мес ₸" value={modalFields.amount || ""} onChange={e => setModalFields({ ...modalFields, amount: e.target.value })} style={S.inp} />
            <div style={S.modalRow}><button style={S.cancelBtn} onClick={() => setModal(null)}>Отмена</button><button style={S.saveBtn} onClick={addExpense}>Добавить</button></div>
          </>}
        </div>
      </div>}
    </div>
  );
}

const S = {
  root: { fontFamily: "'DM Sans',sans-serif", background: "#06061a", color: "#e2e0f0", minHeight: "100vh", maxWidth: 520, margin: "0 auto", paddingBottom: 40 },
  header: { padding: "24px 18px 10px", display: "flex", justifyContent: "space-between", alignItems: "flex-start" },
  title: { fontFamily: "'Playfair Display',serif", fontSize: 24, fontWeight: 800, margin: 0, color: "#fff" },
  sub: { fontSize: 11, color: "#5a5a6a", margin: "3px 0 0" },
  badge: { background: "#0d0c22", border: "1px solid #1c1a35", borderRadius: 14, padding: "7px 14px", textAlign: "right" },
  nav: { display: "flex", gap: 3, padding: "6px 14px 14px", overflowX: "auto" },
  navBtn: { flex: 1, padding: "7px 2px", borderRadius: 11, border: "none", background: "#0a0920", color: "#5a5a6a", fontSize: 10, fontWeight: 500, cursor: "pointer", fontFamily: "'DM Sans',sans-serif", display: "flex", flexDirection: "column", alignItems: "center", gap: 2, minWidth: 0, transition: "all 0.2s" },
  navAct: { background: "linear-gradient(135deg,#1e1b4b,#312e81)", color: "#c7d2fe", boxShadow: "0 2px 12px rgba(99,102,241,0.15)" },
  body: { padding: "0 14px" },
  secTitle: { fontSize: 14, fontWeight: 600, color: "#b0b0c8", margin: "18px 0 10px" },
  addBtn: { width: "100%", padding: "12px", borderRadius: 12, border: "1px dashed #2a2745", background: "transparent", color: "#818cf8", fontSize: 13, cursor: "pointer", fontFamily: "'DM Sans',sans-serif", fontWeight: 500, marginTop: 8 },
  overlay: { position: "fixed", inset: 0, background: "rgba(0,0,0,0.8)", display: "flex", alignItems: "flex-end", justifyContent: "center", zIndex: 100, backdropFilter: "blur(4px)" },
  modal: { background: "#0d0c22", borderRadius: "22px 22px 0 0", padding: "24px 20px 32px", width: "100%", maxWidth: 520, maxHeight: "85vh", overflowY: "auto" },
  modalTitle: { fontFamily: "'Playfair Display',serif", fontSize: 19, fontWeight: 700, color: "#fff", margin: "0 0 16px" },
  inp: { width: "100%", padding: "11px 13px", borderRadius: 11, border: "1px solid #2a2745", background: "#06061a", color: "#fff", fontSize: 14, fontFamily: "'DM Sans',sans-serif", marginBottom: 10, boxSizing: "border-box" },
  modalRow: { display: "flex", gap: 10, marginTop: 4 },
  cancelBtn: { flex: 1, padding: "11px 0", borderRadius: 11, border: "1px solid #2a2745", background: "#06061a", color: "#6a6a7a", fontSize: 14, cursor: "pointer", fontFamily: "'DM Sans',sans-serif" },
  saveBtn: { flex: 1, padding: "11px 0", borderRadius: 11, border: "none", background: "linear-gradient(135deg,#6366f1,#8b5cf6)", color: "#fff", fontSize: 14, fontWeight: 600, cursor: "pointer", fontFamily: "'DM Sans',sans-serif" },
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
